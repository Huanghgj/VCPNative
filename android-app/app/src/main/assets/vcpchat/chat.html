<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<!-- ♡ 只有 morphdom 和 atom-one-dark 是页面初始化必须的——其他重型库全部按需加载 ♡
     KaTeX (~300KB)、Mermaid (~500KB)、highlight.js、particles.js、anime.js
     统统等到第一次被需要时才请求…猫娘不会让主人等不必要的加载时间喵 -->
<link rel="stylesheet" href="vendor/atom-one-dark.min.css"/>
<script defer src="vendor/morphdom.min.js"></script>
<script>
// ── 懒加载管理器♡ 按需加载重型 vendor 库，加载过的不会重复请求喵 ──
var _lazyLoaded={};
function lazyLoadScript(src,cb){
  if(_lazyLoaded[src]){cb&&cb();return}
  var s=document.createElement('script');
  s.src=src;s.onload=function(){_lazyLoaded[src]=true;cb&&cb()};
  s.onerror=function(){console.warn('Lazy load failed: '+src)};
  document.head.appendChild(s);
}
function lazyLoadCSS(href){
  if(_lazyLoaded[href])return;
  var l=document.createElement('link');l.rel='stylesheet';l.href=href;
  document.head.appendChild(l);_lazyLoaded[href]=true;
}
// 确保 KaTeX CSS + JS + auto-render 三件套一起加载♡ 少了任何一个都用不了喵
function ensureKaTeX(cb){
  if(window.renderMathInElement){cb&&cb();return}
  lazyLoadCSS('vendor/katex.min.css');
  lazyLoadScript('vendor/katex.min.js',function(){
    lazyLoadScript('vendor/auto-render.min.js',cb);
  });
}
function ensureHighlightJS(cb){
  if(window.hljs){cb&&cb();return}
  lazyLoadScript('vendor/highlight.min.js',cb);
}
function ensureMermaid(cb){
  if(typeof mermaid!=='undefined'){cb&&cb();return}
  lazyLoadScript('vendor/mermaid.min.js',cb);
}
function ensureAnime(cb){
  if(window.anime){cb&&cb();return}
  lazyLoadScript('vendor/anime.min.js',cb);
}
function ensureParticles(cb){
  if(typeof particlesJS!=='undefined'){cb&&cb();return}
  lazyLoadScript('vendor/particles.min.js',cb);
}
</script>
<style>
/* ── 重置 & 基础 ───────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}

/* ── 猫娘主题变量喵～ ────────────────────────────── */
/* 樱花粉 + 薰衣草紫 + 奶油白，温暖柔软有活力喵 */
:root{
  --bg:#fff5f8;
  --surface:#fffbfc;
  --text:#2d1f28;
  --text-secondary:#8c7884;
  --user-bubble:linear-gradient(135deg,#e8618c 0%,#d4508a 100%);
  --user-bubble-solid:#e8618c;
  --user-text:#fff;
  --ast-bubble:#f3e8f0;
  --ast-text:#2d1f28;
  --system-bg:rgba(156,124,181,0.1);
  --system-text:#9c7cb5;
  --sep:rgba(212,188,197,0.4);
  --link:#d4508a;
  --code-bg:rgba(232,97,140,0.06);
  --pre-bg:#2a1f30;
  --pre-text:#f0dae5;
  --pre-header:#3d2e45;
  --scrollbar:rgba(232,97,140,0.2);
  --tool-bg:linear-gradient(135deg,#3d2e45 0%,#2a1f30 100%);
  --tool-accent:#ff8daf;
  --tool-text:#f0dae5;
  --thought-bg:rgba(156,124,181,0.08);
  --thought-border:rgba(156,124,181,0.2);
  --diary-bg:#fef8f0;--diary-text:#6b4c5e;--diary-border:#f0ddd0;
  --surface-rgb:255,251,252; /* 毛玻璃效果用的 RGB 分量喵 */
}
@media(prefers-color-scheme:dark){
:root{
  --bg:#1a1520;--surface:#251f2a;--text:#ecdfe5;--text-secondary:#a08c98;
  --user-bubble:linear-gradient(135deg,#d4508a 0%,#a83a6e 100%);
  --user-bubble-solid:#ff8daf;--user-text:#fff;
  --ast-bubble:#332b38;--ast-text:#ecdfe5;
  --system-bg:rgba(156,124,181,0.15);--system-text:#cdb0e0;
  --sep:rgba(74,63,78,0.6);--link:#ff8daf;
  --code-bg:rgba(255,141,175,0.08);
  --pre-bg:#1e1528;--pre-text:#f0dae5;--pre-header:#332840;
  --scrollbar:rgba(255,141,175,0.2);
  --tool-bg:linear-gradient(135deg,#1e1528 0%,#332840 100%);
  --tool-accent:#ff8daf;--tool-text:#f0dae5;
  --thought-bg:rgba(156,124,181,0.1);--thought-border:rgba(156,124,181,0.25);
  --diary-bg:#2c2535;--diary-text:#e0d4d9;--diary-border:#4a3f55;
  --surface-rgb:37,31,42; /* 暗色毛玻璃喵 */
}}
body{background:var(--bg);color:var(--text)}

/* 粒子背景层 — 固定在最底层，不遮挡聊天内容喵♡ */
#neko-particles{
  position:fixed;top:0;left:0;right:0;bottom:0;
  z-index:0;pointer-events:none;
}
#neko-particles canvas{pointer-events:none}
#c{position:relative;z-index:1}

/* ── 猫娘色色装饰元素喵～ ──────────────────────── */
/* 彩虹渐变流光 — 用在特殊标题和强调文字上 */
@keyframes neko-rainbow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
/* 星星闪烁 */
@keyframes neko-sparkle{
  0%,100%{opacity:0;transform:scale(0) rotate(0deg)}
  50%{opacity:1;transform:scale(1) rotate(180deg)}
}
/* 心跳脉动 */
@keyframes neko-heartbeat{
  0%,100%{transform:scale(1)}
  15%{transform:scale(1.15)}
  30%{transform:scale(1)}
  45%{transform:scale(1.1)}
}
/* 渐变边框流动 */
@keyframes neko-border-flow{
  0%{border-color:var(--user-bubble-solid,#e8618c)}
  33%{border-color:#9c7cb5}
  66%{border-color:#5bbfad}
  100%{border-color:var(--user-bubble-solid,#e8618c)}
}

/* 用户气泡彩虹光晕 — 发送成功后短暂闪一下 */
.m.user .b{
  position:relative;
}
.m.user .b::before{
  content:'';position:absolute;inset:-2px;z-index:-1;
  border-radius:24px 24px 8px 24px;
  background:linear-gradient(135deg,#e8618c,#9c7cb5,#5bbfad,#e8618c);
  background-size:300% 300%;
  opacity:0;
  transition:opacity 0.5s ease;
}
/* 新消息刚出现时短暂闪光 */
.m.user:last-child .b::before{
  opacity:0.28;
}

/* 助理气泡底部装饰猫爪印 */
.m.assistant .b{position:relative;overflow:visible}
.m.assistant:last-child .b::after{
  content:'🐾';position:absolute;bottom:-8px;right:12px;
  font-size:10px;opacity:0.25;pointer-events:none;
}

/* 系统消息两侧猫猫装饰线 */
.m.system .b{position:relative}
.m.system .b::before{content:'~ ';opacity:0.4;font-style:italic}
.m.system .b::after{content:' ~';opacity:0.4;font-style:italic}

/* 星星闪烁粒子容器 — 用于特殊消息 */
.neko-sparkles{
  position:absolute;top:0;left:0;right:0;bottom:0;
  pointer-events:none;overflow:hidden;
}
.neko-sparkles .star{
  position:absolute;font-size:8px;
  animation:neko-sparkle 1.5s ease-in-out infinite;
}

/* 代码块头部猫猫脚印装饰 */
.code-header::before{
  content:'🐱 ';font-size:10px;opacity:0.6;
}

/* 思考面板 — 猫猫歪头装饰 */
.thought::before{content:'🤔💭 '}

/* 日记面板 — 猫猫写字装饰 */
.diary::before{content:'📝✨ '}

/* 渐变分隔线 — 替代单调的灰色 HR */
.b hr{
  border:none;height:2px;margin:.8em 0;
  background:linear-gradient(90deg,transparent,var(--user-bubble-solid,#e8618c),#9c7cb5,var(--user-bubble-solid,#e8618c),transparent);
  border-radius:1px;opacity:0.4;
}

/* 引用块 — 左边框渐变 + 柔粉背景♡ 暗色模式用更柔和的渐变 */
.b blockquote{
  border-left:3px solid var(--user-bubble-solid,#e8618c);
  border-image:linear-gradient(180deg,var(--user-bubble-solid,#e8618c),#9c7cb5) 1;
  background:rgba(232,97,140,0.04);
  padding:8px 14px;margin:.5em 0;
  border-radius:0 8px 8px 0;
  font-style:italic;
}
@media(prefers-color-scheme:dark){
  .b blockquote{
    border-image:linear-gradient(180deg,var(--user-bubble-solid,#ff8daf),#cdb0e0) 1;
    background:rgba(255,141,175,0.06);
  }
}

/* 行内代码 — 猫娘粉色调 */
.b code{
  background:var(--code-bg);
  border:1px solid rgba(232,97,140,0.12);
  border-radius:5px;
  padding:1px 5px;
}

/* 工具名称彩虹渐变改为猫娘色系 */
.tool-use .tool-name{
  background:linear-gradient(90deg,#e8618c,#9c7cb5,#5bbfad,#e8618c);
  background-size:300% 100%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  font-weight:700;
}

/* ── 猫娘动画关键帧喵～ ────────────────────────── */
/* 气泡入场：从小弹到大，像猫猫优雅地跳出来一样 */
@keyframes neko-pop-in{
  0%{opacity:0;transform:scale(0.7) translateY(10px)}
  60%{transform:scale(1.02) translateY(-1px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
/* 用户气泡从右边滑入 — 缓出，不急不躁 */
@keyframes neko-slide-right{
  0%{opacity:0;transform:translateX(24px) scale(0.92)}
  70%{transform:translateX(-2px) scale(1.005)}
  100%{opacity:1;transform:translateX(0) scale(1)}
}
/* 助理气泡从左边滑入 */
@keyframes neko-slide-left{
  0%{opacity:0;transform:translateX(-24px) scale(0.92)}
  70%{transform:translateX(2px) scale(1.005)}
  100%{opacity:1;transform:translateX(0) scale(1)}
}
/* 系统消息淡入 */
@keyframes neko-fade-up{
  0%{opacity:0;transform:translateY(6px)}
  100%{opacity:1;transform:translateY(0)}
}
/* 流式打字时气泡的呼吸脉动 */
@keyframes neko-breathe{
  0%,100%{box-shadow:0 1px 8px rgba(156,124,181,0.08)}
  50%{box-shadow:0 2px 16px rgba(232,97,140,0.15)}
}
/* 猫爪打字指示器 */
@keyframes neko-paw-bounce{
  0%,80%,100%{transform:translateY(0)}
  40%{transform:translateY(-5px)}
}

/* ── 聊天容器 ───────────────────────────────────── */
#c{
  height:100%;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:none;
  padding:8px 14px 16px;
}
#c::-webkit-scrollbar{width:3px}
#c::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:2px}

/* ── 消息 ───────────────────────────────────────── */
.m{display:flex;align-items:flex-end;margin-bottom:4px;max-width:100%}
/* 动画时长 0.5s，用 cubic-bezier 做柔和的缓出，不急不卡喵 */
.m.user{flex-direction:row-reverse;animation:neko-slide-right 0.5s cubic-bezier(0.23,1,0.32,1) both}
.m.assistant{flex-direction:row;animation:neko-slide-left 0.5s cubic-bezier(0.23,1,0.32,1) both}
.m.system{flex-direction:row;animation:neko-fade-up 0.45s cubic-bezier(0.23,1,0.32,1) both}

/* ── 头像喵～ ──────────────────────────────────── */
.avatar-wrap{
  position:relative;flex-shrink:0;
  width:40px;height:44px; /* 额外高度留给猫耳 */
}
.m.user .avatar-wrap{margin-left:6px}
.m.assistant .avatar-wrap{margin-right:6px}
.avatar{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;cursor:pointer;
  transition:transform 0.2s ease;
  user-select:none;-webkit-user-select:none;
  background-size:cover;background-position:center;
}
.avatar:active{transform:scale(0.9)}
.m.user .avatar{
  background:var(--user-bubble-solid,#e8618c);color:#fff;
}
.m.assistant .avatar{
  background:var(--ast-bubble);color:var(--text);
  border:2px solid var(--user-bubble-solid,#e8618c);
}
.avatar[style*="background-image"]{color:transparent}
/* 猫耳叠在头像上方 */
.avatar-wrap .neko-ears{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  margin:0;width:28px;height:16px;
}

/* ── 头像弹出菜单喵～ ────────────────────────── */
/* 头像弹出菜单 — 毛玻璃 + 向上弹出♡ */
.avatar-menu{
  position:absolute;z-index:100;
  background:rgba(var(--surface-rgb,255,251,252),0.82);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border:1px solid var(--sep);
  border-radius:14px;
  box-shadow:0 -4px 20px rgba(0,0,0,0.12),0 4px 20px rgba(0,0,0,0.08);
  padding:6px 0;min-width:160px;
  animation:avatarMenuUp 0.3s cubic-bezier(0.23,1,0.32,1) both;
}
@keyframes avatarMenuUp{
  0%{opacity:0;transform:translateY(10px) scale(0.95)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
.avatar-menu.hidden{display:none}
.avatar-menu-item{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;font-size:13px;color:var(--text);
  cursor:pointer;transition:background 0.15s;
}
.avatar-menu-item:active{background:rgba(232,97,140,0.08)}
.avatar-menu-item .icon{font-size:16px;width:20px;text-align:center}

/* 头像菜单统计卡片喵♡ */
.avatar-menu-stats{padding:8px 14px}
.stat-row{
  display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--text-secondary);
  padding:3px 0;
}
.stat-icon{font-size:13px;width:18px;text-align:center;flex-shrink:0}
.stat-label{flex:1;opacity:0.8}
.stat-value{
  font-weight:700;font-size:13px;
  color:var(--user-bubble-solid,#e8618c);
  font-variant-numeric:tabular-nums;
}
.avatar-menu-sep{
  height:1px;margin:4px 12px;
  background:linear-gradient(90deg,transparent,var(--sep),transparent);
}

/* ── 猫娘气泡喵～ ──────────────────────────────── */
.b{
  max-width:78%;padding:12px 18px;
  font-size:15px;line-height:1.65;
  word-break:break-word;overflow-wrap:break-word;
}
.m.user .b{
  background:var(--user-bubble);color:var(--user-text);
  border-radius:22px 22px 6px 22px;
  box-shadow:0 2px 12px rgba(232,97,140,0.15);
}
.m.assistant .b{
  background:var(--ast-bubble);color:var(--ast-text);
  border-radius:22px 22px 22px 6px;
  max-width:calc(100% - 44px);margin-right:0;
  box-shadow:0 1px 8px rgba(156,124,181,0.08);
  transition:box-shadow 0.3s ease;
}
/* 流式消息呼吸脉动 — 让用户知道猫娘还在打字喵 */
.m.assistant.streaming .b{
  animation:neko-breathe 1.8s ease-in-out infinite;
}
.m.system .b{
  background:var(--system-bg);color:var(--system-text);
  border-radius:16px;margin:4px auto;max-width:90%;
  text-align:center;font-size:13px;padding:8px 16px;
}

/* ── 猫爪打字指示器喵 ────────────────────────────── */
.neko-typing{
  display:inline-flex;align-items:center;gap:4px;
  padding:10px 18px;
}
.neko-typing .paw{
  display:inline-block;width:8px;height:8px;
  border-radius:50%;background:var(--neko-pink,#e8618c);opacity:0.6;
  animation:neko-paw-bounce 1.2s ease-in-out infinite;
}
.neko-typing .paw:nth-child(2){animation-delay:0.15s}
.neko-typing .paw:nth-child(3){animation-delay:0.3s}

/* ── 猫耳心情指示器喵～ ──────────────────────────── */
/* 叠在 AI 头像上方，由 .avatar-wrap 定位 */
.neko-ears{
  transition:transform 0.4s ease;pointer-events:auto;
}
.neko-ears .ear{
  position:absolute;bottom:0;width:12px;height:16px;
  border-radius:50% 50% 0 0;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.neko-ears .ear.left{left:1px;background:var(--user-bubble-solid,#e8618c);transform:rotate(-15deg)}
.neko-ears .ear.right{right:1px;background:var(--user-bubble-solid,#e8618c);transform:rotate(15deg)}
/* 开心：耳朵竖直 */
.neko-ears.happy .ear.left{transform:rotate(-5deg);height:18px}
.neko-ears.happy .ear.right{transform:rotate(5deg);height:18px}
/* 思考：一只耳朵歪 */
.neko-ears.thinking .ear.left{transform:rotate(-25deg)}
.neko-ears.thinking .ear.right{transform:rotate(5deg);height:14px}
/* 出错/难过：耳朵耷拉 */
.neko-ears.sad .ear.left{transform:rotate(-40deg);height:12px}
.neko-ears.sad .ear.right{transform:rotate(40deg);height:12px}
/* 害羞/撒娇：耳朵抖动 + 脸红色 + 冒爱心 */
.neko-ears.shy .ear.left{
  background:linear-gradient(180deg,#ff6b9d,#ff8daf);
  animation:neko-ear-wiggle 0.5s ease 4;
}
.neko-ears.shy .ear.right{
  background:linear-gradient(180deg,#ff6b9d,#ff8daf);
  animation:neko-ear-wiggle-r 0.5s ease 4;
}
.neko-ears.shy .heart{opacity:1;animation:neko-heartbeat 0.8s ease 3}
/* 摸头彩蛋：耳朵抖动 + 心心 */
@keyframes neko-ear-wiggle{
  0%,100%{transform:rotate(-15deg)}
  25%{transform:rotate(-5deg)}
  75%{transform:rotate(-25deg)}
}
@keyframes neko-ear-wiggle-r{
  0%,100%{transform:rotate(15deg)}
  25%{transform:rotate(25deg)}
  75%{transform:rotate(5deg)}
}
.neko-ears.petted .ear.left{animation:neko-ear-wiggle 0.3s ease 3}
.neko-ears.petted .ear.right{animation:neko-ear-wiggle-r 0.3s ease 3}
.neko-ears .heart{
  position:absolute;top:-10px;right:-2px;font-size:14px;opacity:0;
  transition:opacity 0.3s;pointer-events:none;
}
.neko-ears.petted .heart{opacity:1;animation:neko-fade-up 0.8s ease-out forwards}

/* 摸头台词气泡♡ */
.neko-pet-bubble{
  position:absolute;bottom:calc(100% + 8px);left:50%;
  transform:translateX(-50%) translateY(8px) scale(0.8);
  background:var(--surface);color:var(--text);
  border:1px solid var(--user-bubble-solid,#e8618c);
  border-radius:12px;padding:6px 12px;
  font-size:12px;white-space:nowrap;
  box-shadow:0 4px 16px rgba(232,97,140,0.2);
  opacity:0;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events:none;z-index:50;
}
.neko-pet-bubble.show{
  opacity:1;transform:translateX(-50%) translateY(0) scale(1);
}
/* 小三角 */
.neko-pet-bubble::after{
  content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);
  border-left:5px solid transparent;border-right:5px solid transparent;
  border-top:5px solid var(--user-bubble-solid,#e8618c);
}

/* ── 樱花飘落粒子喵～ ────────────────────────────── */
@keyframes sakura-fall{
  0%{transform:translateY(-10px) rotate(0deg);opacity:0.8}
  50%{opacity:0.6}
  100%{transform:translateY(100vh) rotate(360deg);opacity:0}
}
@keyframes sakura-sway{
  0%,100%{margin-left:0}
  50%{margin-left:30px}
}
.sakura-petal{
  position:fixed;top:-10px;pointer-events:none;z-index:0;
  width:10px;height:10px;border-radius:50% 0 50% 0;
  background:rgba(232,97,140,0.3);
  animation:sakura-fall linear forwards,sakura-sway 3s ease-in-out infinite;
}
@media(prefers-color-scheme:dark){
  .sakura-petal{background:rgba(255,141,175,0.15)}
}

/* ── 猫爪足迹喵～ ────────────────────────────────── */
@keyframes paw-fade{
  0%{opacity:0.5;transform:scale(1)}
  100%{opacity:0;transform:scale(1.5)}
}
.neko-pawprint{
  position:fixed;pointer-events:none;z-index:9998;
  font-size:20px;opacity:0.5;
  animation:paw-fade 0.8s ease-out forwards;
}

/* ── 打字尾巴喵～ ────────────────────────────────── */
/* 由 Android 侧在输入状态时注入到 DOM */
@keyframes neko-tail-wag{
  0%,100%{transform:rotate(-15deg)}
  50%{transform:rotate(15deg)}
}
.neko-tail{
  display:inline-block;font-size:18px;transform-origin:bottom center;
  animation:neko-tail-wag 0.6s ease-in-out infinite;
  vertical-align:middle;margin-left:4px;
}

/* 连续同角色消息 — 中间的头像和猫耳藏起来，只留最后一条的喵 */
.m.user+.m.user{margin-bottom:2px}
.m.user+.m.user .b{border-radius:20px 6px 4px 20px}
.m.user+.m.user .avatar-wrap{visibility:hidden;height:0;width:0;margin:0;overflow:hidden}
.m.assistant+.m.assistant{margin-bottom:2px}
.m.assistant+.m.assistant .b{border-radius:6px 20px 20px 4px;max-width:100%}
.m.assistant+.m.assistant .avatar-wrap{visibility:hidden;height:0;width:0;margin:0;overflow:hidden}
/* 连续消息的最后一条恢复头像显示 */
.m.user+.m.user:last-child .avatar-wrap,
.m.user+.m.user:not(.user+.m.user+.m.user) .avatar-wrap,
.m.assistant+.m.assistant:last-child .avatar-wrap,
.m.assistant+.m.assistant:not(.assistant+.m.assistant+.m.assistant) .avatar-wrap{
  /* 保持隐藏 — 只在组的最后一条（后面不再是同角色）恢复 */
}
/* 后面跟着不同角色的那条消息恢复头像 */
.m.user:not(:has(+.m.user)) .avatar-wrap,
.m.assistant:not(:has(+.m.assistant)) .avatar-wrap{
  visibility:visible;height:auto;width:40px;overflow:visible;
}
.m.user:not(:has(+.m.user)) .avatar-wrap{margin-left:6px}
.m.assistant:not(:has(+.m.assistant)) .avatar-wrap{margin-right:6px}

/* ── 流式光标 ──────────────────────────────────── */
.streaming .b::after{
  content:'';display:inline-block;width:2px;height:1.1em;
  margin-left:2px;background:currentColor;opacity:0.5;
  animation:blink 1s step-end infinite;vertical-align:text-bottom;
}
@keyframes blink{50%{opacity:0}}

/* ── 思考中 ───────────────────────────────────── */
.dots{display:flex;gap:5px;padding:4px 0}
.dots span{
  width:7px;height:7px;border-radius:50%;
  background:currentColor;opacity:0.35;
  animation:pulse 1.4s infinite ease-in-out;
}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.35;transform:scale(1)}40%{opacity:1;transform:scale(1.2)}}

/* ── 排版 ──────────────────────────────────────── */
.b p{margin:.4em 0}.b p:first-child{margin-top:0}.b p:last-child{margin-bottom:0}
.b ul,.b ol{margin:.4em 0;padding-left:1.4em}
.b li{margin:.15em 0}
.b blockquote{
  border-left:3px solid var(--text-secondary);
  margin:.5em 0;padding:2px 10px;opacity:.85;
}
/* 链接 — 猫娘粉色下划线 + 按压微光效果 */
.b a{
  color:var(--link);text-decoration:none;
  border-bottom:1.5px solid currentColor;
  padding-bottom:1px;
  transition:all 0.2s ease;
}
.b a:active{
  background:rgba(232,97,140,0.1);
  border-radius:3px;padding:1px 3px;
}
.m.user .b a{color:rgba(255,255,255,.9);border-bottom-color:rgba(255,255,255,0.4)}
.b code{
  font-family:"SF Mono",Menlo,Consolas,monospace;
  font-size:.87em;padding:1px 5px;
  background:var(--code-bg);border-radius:4px;
}
.m.user .b code{background:rgba(255,255,255,.18)}

/* 代码块 + 语言标签 */
/* 代码块入场渐入 + 左边框猫娘色 */
.code-block{
  position:relative;margin:.6em 0;border-radius:12px;overflow:hidden;
  animation:neko-fade-up 0.55s cubic-bezier(0.23,1,0.32,1) both;
  border-left:3px solid var(--user-bubble-solid,#e8618c);
}
.code-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 12px;background:var(--pre-header);
  font-size:12px;color:var(--pre-text);opacity:.7;
}
.code-header .copy-btn{
  background:none;border:1px solid rgba(255,141,175,.3);
  color:var(--tool-accent);border-radius:8px;padding:3px 10px;
  font-size:11px;cursor:pointer;opacity:.7;
  transition:all 0.2s ease;
}
.code-header .copy-btn:active{
  opacity:1;background:rgba(255,141,175,.15);
  transform:scale(0.95);
}
.code-block pre{
  background:var(--pre-bg);color:var(--pre-text);
  padding:12px 14px;margin:0;overflow-x:auto;
  font-size:13px;line-height:1.5;border-radius:0;
  -webkit-overflow-scrolling:touch;
}
.code-block pre code{background:none;padding:0;font-size:inherit;color:inherit}

/* 表格 */
.b table{border-collapse:collapse;margin:.5em 0;font-size:13px;width:100%;display:block;overflow-x:auto}
.b th,.b td{border:1px solid var(--sep);padding:5px 8px;text-align:left}
.b th{font-weight:600;background:var(--code-bg)}

/* 图片 — 圆角更大 + 悬浮投影 + 入场动画 */
.b img{
  max-width:100%;height:auto;border-radius:12px;margin:6px 0;display:block;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
  animation:neko-pop-in 0.6s cubic-bezier(0.23,1,0.32,1) both;
  transition:transform 0.25s cubic-bezier(0.23,1,0.32,1);
}
.b img:active{transform:scale(0.97)}

/* HR */
.b hr{border:none;border-top:1px solid var(--sep);margin:.8em 0}

/* ── 工具调用气泡 — 猫娘风入场动画 ────────────── */
.tool-use{
  background:var(--tool-bg);color:var(--tool-text);
  border-radius:12px;padding:10px 14px 10px 38px;
  margin:.5em 0;position:relative;
  font-family:Menlo,Consolas,monospace;font-size:13px;
  border:1px solid rgba(255,141,175,.2);
  animation:neko-pop-in 0.55s cubic-bezier(0.23,1,0.32,1) both;
}
.tool-use::before{
  content:"⚙️";position:absolute;top:10px;left:10px;
  font-size:16px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.tool-use .tool-label{color:var(--tool-accent);font-weight:700;font-size:12px}
.tool-use .tool-name{
  background:linear-gradient(90deg,#f1c40f,#fff,#4fc3f7,#f1c40f);
  background-size:300% 100%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  font-weight:700;
}
@keyframes flow{to{background-position:-300% 0}}
.tool-use .tool-body{
  margin-top:6px;padding-top:6px;
  border-top:1px dashed rgba(255,255,255,.15);
  white-space:pre-wrap;opacity:.8;font-size:12px;
  max-height:120px;overflow:hidden;
  transition:max-height .3s;
}
.tool-use.expanded .tool-body{max-height:2000px}

/* ── 工具结果气泡 ──────────────────────────────── */
.tool-result{
  background:var(--surface);border:1px solid var(--sep);
  border-radius:10px;padding:10px 14px;margin:.5em 0;
  font-size:13px;
}
.tool-result-header{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  padding-bottom:6px;
}
.tool-result-label{color:#34c759;font-weight:700;font-size:12px}
.tool-result-name{
  background:rgba(52,199,89,.15);color:#34c759;
  padding:1px 8px;border-radius:4px;font-size:12px;font-weight:600;
}
.tool-result-status{font-size:11px;color:var(--text-secondary);margin-left:auto}
.tool-result-toggle{
  width:16px;height:16px;position:relative;cursor:pointer;flex-shrink:0;
}
.tool-result-toggle::before,.tool-result-toggle::after{
  content:'';position:absolute;background:var(--text-secondary);
  top:50%;left:50%;transform:translate(-50%,-50%);border-radius:1px;
}
.tool-result-toggle::before{width:10px;height:2px}
.tool-result-toggle::after{width:2px;height:10px;transition:transform .2s}
.tool-result.expanded .tool-result-toggle::after{transform:translate(-50%,-50%) rotate(90deg)}
.tool-result-body{
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height .3s,opacity .2s;
}
.tool-result.expanded .tool-result-body{
  max-height:2000px;opacity:1;
  margin-top:6px;padding-top:8px;
  border-top:1px dashed var(--sep);
}
.tool-result-item{margin-bottom:4px}
.tool-result-key{color:var(--tool-accent);font-weight:600;font-size:12px}
.tool-result-val{margin-top:2px;color:var(--text)}
.tool-result-val img{max-height:200px}

/* ── 思维链 ────────────────────────────────────── */
.thought{
  background:var(--thought-bg);border:1px solid var(--thought-border);
  border-radius:12px;padding:10px 14px;margin:.5em 0;
  max-width:98%;
}
.thought-header{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  font-size:13px;color:var(--text-secondary);
}
.thought-header .icon{font-size:16px;filter:grayscale(0.3)}
.thought-header .label{font-weight:600}
.thought-body{
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .3s;
  font-style:italic;font-size:14px;
}
.thought.expanded .thought-body{
  max-height:3000px;opacity:1;
  margin-top:8px;padding-top:8px;
  border-top:1px dashed var(--thought-border);
}
.thought-body pre{font-style:normal;background:var(--code-bg);padding:8px;border-radius:6px}

/* ── 日记 ──────────────────────────────────────── */
.diary{
  background:var(--diary-bg);color:var(--diary-text);
  border:1px solid var(--diary-border);
  border-radius:10px;padding:12px 16px 14px 44px;
  margin:.5em 0;position:relative;
  font-family:Georgia,"Times New Roman",serif;line-height:1.7;
}
.diary::before{content:"✒️";position:absolute;top:12px;left:14px;font-size:18px;opacity:.6;transform:rotate(-15deg)}
.diary-header{
  display:flex;justify-content:space-between;
  border-bottom:1px solid var(--diary-border);
  padding-bottom:6px;margin-bottom:8px;
}
.diary-title{font-weight:700;font-size:1.05em}
.diary-date{font-size:.85em;opacity:.7;font-style:italic}
.diary-maid{font-size:.9em;margin-bottom:6px;opacity:.8}

/* ── 角色分界 ──────────────────────────────────── */
.role-div{
  display:flex;align-items:center;justify-content:center;
  margin:12px 0;font-size:12px;opacity:.6;user-select:none;
}
.role-div::before,.role-div::after{
  content:'';flex:1;border-bottom:1px dashed var(--sep);margin:0 12px;
}
.role-div.system{color:#e67e22}.role-div.assistant{color:#3498db}.role-div.user{color:#2ecc71}
.role-div.end{opacity:.35}

/* ── 按钮点击 ──────────────────────────────────── */
.btn-click{
  display:inline-block;
  background:linear-gradient(135deg,#6a11cb,#2575fc);
  color:#fff;padding:4px 12px;border-radius:14px;
  font-size:13px;font-weight:500;margin:2px 0;
}

/* ── 长按菜单 ──────────────────────────────────── */
/* 长按菜单 — 毛玻璃效果喵♡ */
#ctxMenu{
  position:fixed;z-index:9998;
  background:rgba(var(--surface-rgb,255,251,252),0.82);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-radius:14px;padding:6px 0;
  min-width:180px;
  box-shadow:0 8px 30px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.08);
  display:none;overflow:hidden;
  animation:menuIn .15s ease-out;
}
#ctxMenu.active{display:block}
@keyframes menuIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.ctx-item{
  padding:11px 16px;font-size:14px;
  display:flex;align-items:center;gap:10px;
  color:var(--text);cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.ctx-item:active{background:var(--code-bg)}
.ctx-item.danger{color:#ff3b30}
.ctx-sep{height:.5px;background:var(--sep);margin:4px 12px}
.ctx-icon{width:18px;text-align:center;font-size:15px;opacity:.7}

/* ── 遮罩 ──────────────────────────────────────── */
#ctxOverlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  z-index:9997;display:none;
}
#ctxOverlay.active{display:block}

/* ── HTML 渲染块 ───────────────────────────────── */
.html-render{border-radius:10px;overflow:hidden;margin:4px -4px}
.html-render *{max-width:100%}

/* ── Mermaid 图表 ───────────────────────────────── */
.mermaid-placeholder{padding:12px;color:var(--text-secondary);font-size:13px;text-align:center}
.mermaid{overflow-x:auto;margin:.5em 0}
.mermaid svg{max-width:100%}

/* ── 继续按钮（现在只在 AI 头像菜单里显示，不再独立漂浮）── */
.continue-btn{display:none}
.m.streaming .continue-btn{display:none}

/* ── morphdom 流式新元素渐入 ───────────────────── */
.vcp-stream-element-fade-in{animation:vcpFadeIn .3s ease-out}
@keyframes vcpFadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── Stable/Tail 流式分层♡ ────────────────────── */
/* 猫娘把流式输出的身体分成两半——上面是已经定型的 Stable 部分，
   下面是还在扭动的 Tail 部分…只有 Tail 需要被 morphdom 不停抚摸♡
   Stable 一旦固定就不会再被碰了——省下大量 CPU 计算喵 */
.vcp-stream-stable-root,.vcp-stream-tail-root{display:block}
.vcp-stream-tail-root>*:first-child{margin-top:0}
/* 脉冲微动画：Tail 区内容增长时的微微颤抖♡ */
.vcp-stream-content-pulse{animation:vcpPulse .3s ease-out}
@keyframes vcpPulse{0%{opacity:.85}100%{opacity:1}}

/* ── 可见性优化：暂停离屏消息动画 ─────────────── */
.vcp-paused,.vcp-paused *{animation-play-state:paused!important;transition:none!important}

/* ── HTML 预览（iframe）────────────────────────── */
.html-preview{position:relative;margin:.5em 0;border-radius:10px;overflow:hidden;border:1px solid var(--sep)}
.html-preview-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 10px;background:var(--pre-header);font-size:12px;color:var(--pre-text);
}
.html-preview-bar button{
  background:var(--user-bubble);color:#fff;border:none;
  padding:4px 12px;border-radius:6px;font-size:12px;cursor:pointer;
}
.html-preview iframe{
  width:100%;border:none;background:#fff;
  min-height:200px;display:none;
}
.html-preview-placeholder{
  padding:14px 12px;
  color:var(--text-secondary);
  font-size:13px;
  background:var(--surface);
}
.html-preview.active iframe{display:block}
.html-preview.active .code-block,
.html-preview.active .html-render,
.html-preview.active .html-preview-placeholder{display:none}

/* ── Skill 状态标签 ──────────────────────────────── */
.skill-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 12px;margin:4px 0;
  border-radius:10px;font-size:12px;font-weight:500;
  background:linear-gradient(135deg,var(--user-bubble),color-mix(in srgb,var(--user-bubble) 70%,#000));
  color:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.12);
  animation:skillChipIn .35s cubic-bezier(.34,1.56,.64,1) both;
}
.skill-chip code{
  background:rgba(255,255,255,0.18);padding:1px 5px;border-radius:4px;font-size:11px;
}
.skill-chip-icon{font-size:13px;}
@keyframes skillChipIn{
  0%{opacity:0;transform:scale(0.7) translateY(4px);}
  100%{opacity:1;transform:scale(1) translateY(0);}
}

/* ── 图片查看器覆盖层 ─────────────────────────── */
#imgViewer{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.92);z-index:9999;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
}
#imgViewer.active{display:flex}
#imgViewer img{
  max-width:95%;max-height:80vh;
  object-fit:contain;border-radius:4px;
  user-select:none;-webkit-user-select:none;
  touch-action:none; /* 禁用浏览器默认手势，让我们自己处理缩放喵 */
  transition:transform 0.1s ease-out;
}
#imgViewer .toolbar{
  position:absolute;bottom:env(safe-area-inset-bottom,20px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  display:flex;gap:16px;
}
#imgViewer .toolbar button{
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  color:#fff;padding:10px 24px;border-radius:22px;
  font-size:14px;font-weight:500;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  cursor:pointer;
}
#imgViewer .toolbar button:active{background:rgba(255,255,255,.3)}
#imgViewer .close-btn{
  position:absolute;top:env(safe-area-inset-top,12px);
  top:calc(env(safe-area-inset-top,0px) + 12px);
  right:16px;
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.15);border:none;color:#fff;
  font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
/* 附件样式 */
.message-attachments{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.message-attachment-image-thumbnail{max-width:150px;max-height:150px;border-radius:8px;object-fit:cover;border:2px solid rgba(255,255,255,.2)}
.message-attachments audio{max-width:250px}
.message-attachments video{border-radius:8px}
.file-attachment-badge{display:inline-block;padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.1);font-size:13px}
</style>
</head>
<body>
<!-- 粒子背景层 — 在聊天内容下方♡ -->
<div id="neko-particles"></div>
<div id="c"></div>

<!-- 长按上下文菜单 -->
<div id="ctxOverlay"></div>
<div id="ctxMenu"></div>

<!-- 图片查看器 -->
<div id="imgViewer">
  <button class="close-btn" onclick="closeImgViewer()">✕</button>
  <img id="imgViewerImg" src="" alt=""/>
  <div class="toolbar">
    <button onclick="saveImage()">保存图片</button>
    <button onclick="copyImageUrl()">复制链接</button>
  </div>
</div>

<script src="vendor/purify.min.js"></script>
<script>
(function(){
'use strict';
var C=document.getElementById('c'),
    MM={},autoScroll=true,scrollT=null;
var PERF_FLAGS={
  enableAmbientEffects:false,
  enableTouchTrails:false,
  autoRunFullHtml:true
};

// ── 视界优化器♡ 离屏消息动画冻结 ─────────────────
// 从桌面端 visibilityOptimizer.js 移植的轻量版♡
// IntersectionObserver 自动检测哪些消息在屏幕外——
// 离屏的加上 .vcp-paused（冻结 CSS 动画 + 暂停 video/audio）
// 回到视野时自动恢复——猫娘只让看得见的东西动起来♡
var _visObserver=null;
var _visPendingPause=new Set();
var _visPendingResume=new Set();
var _visBatchTimer=null;

function _visScheduleBatch(){
  if(_visBatchTimer)return;
  _visBatchTimer=setTimeout(function(){
    _visBatchTimer=null;
    // 先暂停（优先释放资源♡）
    _visPendingPause.forEach(function(el){
      el.classList.add('vcp-paused');
      // 暂停 video/audio 媒体元素
      el.querySelectorAll('video,audio').forEach(function(m){
        if(!m.paused)try{m.pause();m._vcpWasPaused=true}catch(e){}
      });
    });
    _visPendingPause.clear();
    // 再恢复
    _visPendingResume.forEach(function(el){
      el.classList.remove('vcp-paused');
      // 恢复被猫娘暂停的媒体
      el.querySelectorAll('video,audio').forEach(function(m){
        if(m._vcpWasPaused)try{m.play();m._vcpWasPaused=false}catch(e){}
      });
    });
    _visPendingResume.clear();
  },50);
}

function _visObserve(msgEl){
  if(!_visObserver||!msgEl)return;
  _visObserver.observe(msgEl);
}

// 初始化 IntersectionObserver（200px 预加载边距♡）
if(typeof IntersectionObserver!=='undefined'){
  _visObserver=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      var el=entry.target;
      if(entry.isIntersecting){
        _visPendingPause.delete(el);
        _visPendingResume.add(el);
      }else{
        _visPendingResume.delete(el);
        _visPendingPause.add(el);
      }
    });
    _visScheduleBatch();
  },{root:C,rootMargin:'200px 0px',threshold:0});
}

// ── 特殊标记正则 ────────────────────────────────
var RE={
  tool:/<<<\[TOOL_REQUEST\]>>>([\s\S]*?)<<<\[END_TOOL_REQUEST\]>>>/g,
  toolResult:/\[\[VCP调用结果信息汇总:([\s\S]*?)VCP调用结果结束\]\]/g,
  thought:/\[---\s*VCP元思考链(?::\s*"([^"]*)")?\s*---\]([\s\S]*?)\[---\s*元思考链结束\s*---\]/g,
  think:/<think(?:ing)?>([\s\S]*?)<\/think(?:ing)?>/gi,
  note:/<<<DailyNoteStart>>>([\s\S]*?)<<<DailyNoteEnd>>>/g,
  roleDiv:/<<<\[(END_)?ROLE_DIVIDE_(SYSTEM|ASSISTANT|USER)\]>>>/g,
  btnClick:/\[\[点击按钮:(.*?)\]\]/g,
  canvas:/\{\{VCPChatCanvas\}\}/g,
  desktopPush:/<<<\[DESKTOP_PUSH\]>>>([\s\S]*?)<<<\[DESKTOP_PUSH_END\]>>>/g,
};

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ── HTML 净化（DOMPurify，对齐 VCPChat）─────────
// 允许所有 HTML 标签和 style；仅删除 script 和危险事件处理器。
// onclick="input(...)" 会被 hook 转为安全的 data-send 属性。
var _purifyConfig={
  ADD_TAGS:['iframe','style','details','summary'],
  ADD_ATTR:['data-send','sandbox','srcdoc','target','allow'],
  ALLOW_DATA_ATTR:true,
  FORBID_TAGS:['script'],
  FORBID_ATTR:[]  // on* 由 hook 处理
};
if(typeof DOMPurify!=='undefined'){
  // Hook：在删除属性前，把 onclick="input('...')" 提取到 data-send
  DOMPurify.addHook('uponSanitizeAttribute',function(node,data){
    if(data.attrName.startsWith('on')&&data.attrValue){
      // 提取 input('...') 或 input("...") 的参数
      var m=data.attrValue.match(/^(?:window\.)?input\(\s*(['"])([\s\S]*?)\1\s*\)$/);
      if(m&&(node.nodeName==='BUTTON'||node.nodeName==='A')){
        node.setAttribute('data-send',m[2]);
      }
      // 删除所有 on* 属性
      data.keepAttr=false;
    }
  });
}
function sanitize(html){
  if(typeof DOMPurify!=='undefined'){
    return DOMPurify.sanitize(html,_purifyConfig);
  }
  // Fallback：极简 regex（DOMPurify 加载失败时）
  return html.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi,'')
    .replace(/on\w+\s*=\s*["'][^"']*["']/gi,'')
    .replace(/javascript\s*:/gi,'blocked:');
}

// ── Markdown 渲染 ──────────────────────────────
function md(text){
  if(!text)return '';
  var h=esc(text);
  // 代码块 → 带语言标签；HTML 完整文档 → 可预览
  h=h.replace(/```(\w*)\n([\s\S]*?)```/g,function(_,lang,code){
    var trimmed=code.trim();
    // Mermaid 图表 → 占位符（后续异步渲染）
    if(lang==='mermaid'||lang==='flowchart'||lang==='graph'){
      var encoded=encodeURIComponent(trimmed);
      return '<div class="mermaid-placeholder" data-mermaid-code="'+encoded+'"></div>';
    }
    // Python 代码块 — 提供 Pyodide 运行按钮
    if(lang==='python'||lang==='py'){
      var pyId='py_'+Date.now()+'_'+Math.random().toString(36).substr(2,4);
      var langClass=' class="language-python"';
      return '<div class="code-block" id="'+pyId+'">'+
        '<div class="code-header"><span>python</span>'+
        '<span class="copy-btn" onclick="copyCode(this)">复制</span> '+
        '<span class="copy-btn" onclick="runPython(\''+pyId+'\')">▶ 运行</span></div>'+
        '<pre><code'+langClass+'>'+trimmed+'</code></pre>'+
        '<pre class="py-output" style="display:none;background:var(--surface);color:var(--text);padding:8px 12px;margin:0;border-top:1px solid var(--sep);font-size:12px;max-height:300px;overflow:auto"></pre></div>';
    }
    // 检测完整 HTML 文档 — 提供"运行"预览
    if((lang==='html'||lang==='')&&/<!DOCTYPE\s+html|<html[\s>]/i.test(trimmed)){
      var id='hp_'+Date.now()+'_'+Math.random().toString(36).substr(2,4);
      return '<div class="html-preview" id="'+id+'">'+
        '<div class="html-preview-bar"><span>HTML 文档</span>'+
        '<button onclick="toggleHtmlPreview(\''+id+'\')">▶️ 运行</button></div>'+
        '<div class="code-block"><pre><code>'+trimmed+'</code></pre></div>'+
        '<iframe sandbox="allow-scripts"></iframe></div>';
    }
    // 代码块 — 带语言 class 供 highlight.js 识别
    var langClass=lang?' class="language-'+lang+'"':'';
    var header=lang?'<div class="code-header"><span>'+lang+'</span><span class="copy-btn" onclick="copyCode(this)">复制</span></div>':'';
    return '<div class="code-block">'+header+'<pre><code'+langClass+'>'+trimmed+'</code></pre></div>';
  });
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');
  // Image regex MUST run before link regex, otherwise ![alt](url) matches as !<a>
  h=h.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1" loading="lazy"/>');
  h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  h=h.replace(/^#{3} (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^#{2} (.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/^#{1} (.+)$/gm,'<h1>$1</h1>');
  h=h.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/^[-*] (.+)$/gm,'<li>$1</li>');
  h=h.replace(/(<li>[\s\S]*?<\/li>(\n|$))+/g,'<ul>$&</ul>');
  h=h.replace(/^---$/gm,'<hr/>');
  h=h.replace(/\n\n+/g,'</p><p>');
  h=h.replace(/\n/g,'<br/>');
  h='<p>'+h+'</p>';
  h=h.replace(/<p><\/p>/g,'');
  h=h.replace(/<p>(<(?:h[1-6]|pre|ul|ol|blockquote|hr|div))/g,'$1');
  h=h.replace(/(<\/(?:h[1-6]|pre|ul|ol|blockquote|hr|div)>)<\/p>/g,'$1');
  return h;
}

// ── 内容预处理管线♡ ────────────────────────────
// 从桌面端 contentPipeline.js 移植的统一流水线♡
// 两种模式：FULL（complete 时用）和 FAST（流式帧用）
// 核心：protect → transform → restore 三段式♡
// 先用占位符保护工具结果和代码块，防止 Markdown/特殊块转换破坏它们
// 转换完成后再把占位符恢复回去——就像猫娘先用保鲜膜把好东西包起来♡
var _pipeline={
  _toolPlaceholderId:0,
  _codePlaceholderId:0,

  // 保护工具结果块 → 替换为占位符♡
  protectToolResults:function(text){
    var map=new Map();
    RE.toolResult.lastIndex=0;
    if(!RE.toolResult.test(text)){RE.toolResult.lastIndex=0;return {text:text,map:map}}
    RE.toolResult.lastIndex=0;
    var self=this;
    var result=text.replace(RE.toolResult,function(match){
      var ph='__VCP_TOOL_RESULT_'+self._toolPlaceholderId+'__';
      map.set(ph,match);
      self._toolPlaceholderId++;
      return ph;
    });
    RE.toolResult.lastIndex=0;
    return {text:result,map:map};
  },

  // 保护代码块 → 替换为占位符♡
  protectCodeBlocks:function(text){
    var map=new Map();
    if(text.indexOf('```')===-1)return {text:text,map:map};
    var re=/```\w*[\s\S]*?```/g;
    var self=this;
    var result=text.replace(re,function(match){
      var ph='__VCP_CODE_BLOCK_'+self._codePlaceholderId+'__';
      map.set(ph,match);
      self._codePlaceholderId++;
      return ph;
    });
    return {text:result,map:map};
  },

  // 恢复占位符♡
  restore:function(text,map){
    if(!map||map.size===0)return text;
    map.forEach(function(original,ph){
      if(text.indexOf(ph)!==-1)text=text.split(ph).join(original);
    });
    return text;
  },

  // 「始」「末」安全转义♡
  escapeMarkers:function(text){
    if(typeof text!=='string'||text.indexOf('「始」')===-1)return text;
    return text.replace(/「始」([\s\S]*?)(「末」|$)/g,function(_,c,e){
      return '「始」'+esc(c)+e;
    });
  },

  // ── FULL_RENDER 管线♡ complete 时使用 ──
  // 顺序协议：protect → 结构修正 → 恢复工具 → 特殊块转换 → 恢复代码块
  fullRender:function(text,role){
    if(!text)return '';
    this._toolPlaceholderId=0;
    this._codePlaceholderId=0;
    // 1. 安全转义
    var t=this.escapeMarkers(text);
    // 2. 保护工具结果和代码块
    var toolProtect=this.protectToolResults(t);
    t=toolProtect.text;
    var codeProtect=this.protectCodeBlocks(t);
    t=codeProtect.text;
    // 3. 恢复工具结果（特殊块转换需要识别它们）
    t=this.restore(t,toolProtect.map);
    // 4. 特殊块转换（工具、思维链、日记等）
    t=processSpecial(t,role);
    // 5. 恢复代码块
    t=this.restore(t,codeProtect.map);
    return t;
  },

  // ── STREAM_FAST 管线♡ 流式帧使用 ──
  // 只做最轻量的修正，不做特殊块转换（避免碎片状态下误匹配）
  streamFast:function(text){
    if(!text)return '';
    return this.escapeMarkers(text);
  }
};

// ── 特殊内容处理 ────────────────────────────────
function processSpecial(content,role){
  if(!content)return '';
  var out=content;

  // 工具调用（不用 inline onclick，由事件委托处理 .vcp-toggle）
  out=out.replace(RE.tool,function(_,body){
    var nameM=body.match(/tool_name:\s*「始」(.*?)「末」/);
    var name=nameM?nameM[1]:'Unknown Tool';
    return '<div class="tool-use vcp-toggle">'+
      '<span class="tool-label">VCP-ToolUse</span> '+
      '<span class="tool-name">'+esc(name)+'</span>'+
      '<div class="tool-body">'+esc(body.trim())+'</div></div>';
  });

  // 工具结果
  out=out.replace(RE.toolResult,function(_,body){
    var lines=body.trim().split('\n');
    var items='';
    var nameM=body.match(/tool_name[：:]\s*(.+)/);
    var statusM=body.match(/status[：:]\s*(.+)/);
    lines.forEach(function(line){
      var kv=line.match(/^([^：:]+)[：:]\s*([\s\S]*)$/);
      if(kv){
        items+='<div class="tool-result-item"><span class="tool-result-key">'+esc(kv[1].trim())+'</span>'+
          '<div class="tool-result-val">'+md(kv[2].trim())+'</div></div>';
      }
    });
    return '<div class="tool-result vcp-toggle">'+
      '<div class="tool-result-header">'+
        '<span class="tool-result-label">ToolResult</span>'+
        (nameM?'<span class="tool-result-name">'+esc(nameM[1].trim())+'</span>':'')+
        (statusM?'<span class="tool-result-status">'+esc(statusM[1].trim())+'</span>':'')+
        '<span class="tool-result-toggle"></span>'+
      '</div>'+
      '<div class="tool-result-body">'+items+'</div></div>';
  });

  // VCP 思维链
  out=out.replace(RE.thought,function(_,theme,body){
    var label=theme||'思维链';
    return '<div class="thought vcp-toggle">'+
      '<div class="thought-header"><span class="icon">🧠</span><span class="label">'+esc(label)+'</span></div>'+
      '<div class="thought-body">'+md(body.trim())+'</div></div>';
  });
  // <think> / <thinking>
  out=out.replace(RE.think,function(_,body){
    return '<div class="thought vcp-toggle">'+
      '<div class="thought-header"><span class="icon">🧠</span><span class="label">思维链</span></div>'+
      '<div class="thought-body">'+md(body.trim())+'</div></div>';
  });

  // 日记
  out=out.replace(RE.note,function(_,body){
    var maidM=body.match(/Maid:\s*(.+)/);
    var dateM=body.match(/Date:\s*(.+)/);
    var contentM=body.match(/Content:\s*([\s\S]*)/);
    return '<div class="diary">'+
      '<div class="diary-header"><span class="diary-title">Maid\'s Diary</span>'+
      (dateM?'<span class="diary-date">'+esc(dateM[1].trim())+'</span>':'')+'</div>'+
      (maidM?'<div class="diary-maid">'+esc(maidM[1].trim())+'</div>':'')+
      '<div>'+(contentM?md(contentM[1].trim()):'')+'</div></div>';
  });

  // 角色分界
  out=out.replace(RE.roleDiv,function(_,end,role){
    var cls=role.toLowerCase()+(end?' end':'');
    var label={'SYSTEM':'系统','ASSISTANT':'助手','USER':'用户'}[role]||role;
    return '<div class="role-div '+cls+'">'+label+(end?' 结束':' 开始')+'</div>';
  });

  // 按钮点击
  out=out.replace(RE.btnClick,function(_,text){
    return '<span class="btn-click">▶️ '+esc(text)+'</span>';
  });

  // Canvas 占位
  out=out.replace(RE.canvas,function(){
    return '<div style="padding:8px 14px;border:1px dashed var(--sep);border-radius:8px;font-size:13px;color:var(--text-secondary)">Canvas 协同中<span class="dots"><span></span><span></span><span></span></span></div>';
  });

  // 桌面推送
  out=out.replace(RE.desktopPush,function(_,body){
    return '<div style="background:var(--thought-bg);border:1px solid var(--thought-border);border-radius:10px;padding:10px 14px;margin:.5em 0;font-size:13px"><span style="opacity:.6">📤 桌面推送</span><div>'+md(body.trim())+'</div></div>';
  });

  return out;
}

function renderContent(content,role){
  if(!content)return '';
  // 通过统一管线做 protect → 特殊块转换 → restore♡
  var processed=_pipeline.fullRender(content,role);

  // ★ 优先检测是否已被特殊处理器转换（包含我们的组件 class）
  // 这些组件自带 onclick 事件，不能进 sanitize 否则 onclick 会被 DOMPurify 删除
  var hasVcpComponents=/<(?:div|span) class="(?:tool-|thought|diary|role-div|btn-click)/.test(processed);

  // 检测完整 HTML 文档 — 不 sanitize（后续用 iframe sandbox 隔离运行）
  if(/<!DOCTYPE\s+html|<html[\s>]/i.test(processed)){
    return '<div class="html-render" data-full-html="1">'+processed+'</div>';
  }
  // 检测含 <script> 的交互式 HTML 片段 — 用 iframe 隔离（脚本不能在主页面执行）
  if(/<style[\s>]/i.test(processed)&&/<script[\s>]/i.test(processed)){
    return '<div class="html-render" data-full-html="1">'+processed+'</div>';
  }
  // 含 <style> + onclick 但无 <script> 的片段 — 内联渲染（CSS scoping 隔离样式）
  if(/<style[\s>]/i.test(processed)&&/\bon\w+\s*=/i.test(processed)){
    return '<div class="html-render">'+processed+'</div>';
  }

  // 包含 VCP 组件时：组件不用 inline onclick（靠事件委托），
  // 不走 sanitize（否则 class 和结构可能被破坏）。
  // 对组件之间的纯文本段做 md() 渲染。
  if(hasVcpComponents){
    // 标记所有组件位置
    var vcpRe=/<div class="(?:tool-use|tool-result|thought|diary|role-div|btn-click)\b/g;
    var parts=[],lastEnd=0,match;
    // SECURITY: run sanitize() FIRST so VCP component innerHTML can't carry XSS payloads
    var tmp=document.createElement('div');tmp.innerHTML=sanitize(processed);
    var result='';
    var vcpClasses=['tool-use','tool-result','thought','diary','role-div','btn-click'];
    tmp.childNodes.forEach(function(node){
      if(node.nodeType===1&&node.classList){
        var isVcp=false;
        for(var c=0;c<vcpClasses.length;c++){if(node.classList.contains(vcpClasses[c])){isVcp=true;break;}}
        if(isVcp){
          result+=node.outerHTML;
        }else{
          result+=sanitize(node.outerHTML);
        }
      }else if(node.nodeType===3){
        var t=node.textContent.trim();
        if(t)result+=md(t);
      }
    });
    return result;
  }

  // 普通 HTML 片段 — sanitize 防 XSS
  if(/<(?:div|style|svg|canvas|iframe|table|script|head|body)\b/i.test(processed)){
    return '<div class="html-render">'+sanitize(processed)+'</div>';
  }
  return md(processed);
}

// ── 后处理：按需懒加载 KaTeX / highlight.js / Mermaid + CSS scoping ──
// 以前是页面一打开就把所有库塞进来…现在猫娘只在需要的时候才请求♡
// 没有数学公式就不加载 KaTeX，没有代码块就不加载 highlight.js——多省心喵
function postProcessContent(container){
  // 1. KaTeX 数学公式♡ 检测到公式才按需加载
  var hasMath=/\$\$[\s\S]+?\$\$|\$[^\$\n]+?\$|\\\([\s\S]+?\\\)|\\\[[\s\S]+?\\\]/.test(container.innerHTML);
  if(hasMath){
    ensureKaTeX(function(){
      if(!window.renderMathInElement)return;
      try{
        renderMathInElement(container,{
          delimiters:[
            {left:'$$',right:'$$',display:true},
            {left:'$',right:'$',display:false},
            {left:'\\(',right:'\\)',display:false},
            {left:'\\[',right:'\\]',display:true}
          ],
          throwOnError:false
        });
      }catch(e){}
    });
  }
  // 2. 代码高亮♡ 有 <pre><code> 才加载 highlight.js
  var codeBlocks=container.querySelectorAll('pre code');
  if(codeBlocks.length){
    ensureHighlightJS(function(){
      if(!window.hljs)return;
      codeBlocks.forEach(function(block){
        if(block&&block.parentElement&&!block.parentElement.dataset.vcpPrettified){
          try{hljs.highlightElement(block)}catch(e){}
        }
      });
    });
  }
  // 3. Mermaid 图表♡ 有 placeholder 才加载
  var mermaidPlaceholders=container.querySelectorAll('.mermaid-placeholder');
  if(mermaidPlaceholders.length){
    ensureMermaid(function(){renderMermaidInContainer(container)});
  }
  // 4. CSS scoping（防止 AI HTML 样式污染聊天页面）
  scopeHtmlRenderStyles(container);
}

// ── Mermaid 异步渲染 ──────────────────────────────
var _mermaidReady=false;
function renderMermaidInContainer(container){
  var placeholders=container.querySelectorAll('.mermaid-placeholder');
  if(!placeholders.length)return;
  if(typeof mermaid==='undefined')return;
  if(!_mermaidReady){mermaid.initialize({startOnLoad:false,theme:'default'});_mermaidReady=true}
  placeholders.forEach(function(el){
    var code=el.dataset.mermaidCode;
    if(!code)return;
    try{
      var decoded=decodeURIComponent(code).replace(/[—–－]/g,'--');
      el.textContent=decoded;
      el.classList.remove('mermaid-placeholder');
      el.classList.add('mermaid');
    }catch(e){el.textContent='[Mermaid 解码错误]';return}
  });
  var elems=container.querySelectorAll('.mermaid');
  if(elems.length){
    elems.forEach(function(el){
      try{mermaid.run({nodes:[el]})}catch(e){
        var src=el.textContent;
        el.innerHTML='<div style="color:var(--system-text);font-size:12px">Mermaid 渲染错误</div><pre style="font-size:11px;overflow-x:auto">'+esc(src)+'</pre>';
      }
    });
  }
}

// ── CSS Scoping ───────────────────────────────────
function scopeHtmlRenderStyles(container){
  container.querySelectorAll('.html-render:not([data-full-html])').forEach(function(el){
    var styles=el.querySelectorAll('style');
    if(!styles.length)return;
    var scopeId='vcp-s-'+Math.random().toString(36).substr(2,6);
    el.id=scopeId;
    styles.forEach(function(styleEl){
      styleEl.textContent=scopeCss(styleEl.textContent,scopeId);
    });
  });
}
function scopeCss(css,scopeId){
  css=css.replace(/\/\*[\s\S]*?\*\//g,'');
  var rules=[],depth=0,cur='';
  for(var i=0;i<css.length;i++){
    var ch=css[i];cur+=ch;
    if(ch==='{')depth++;
    else if(ch==='}'){depth--;if(depth===0){rules.push(cur.trim());cur=''}}
  }
  return rules.map(function(rule){
    var m=rule.match(/^([^{]+)\{([\s\S]+)\}$/);
    if(!m)return rule;
    var sels=m[1].split(',').map(function(s){
      s=s.trim();
      if(/^(@|from|to|\d+%|:root|html|body)/.test(s))return s;
      if(/^::?[\w-]+$/.test(s))return '#'+scopeId+s;
      return '#'+scopeId+' '+s;
    }).join(', ');
    return sels+' { '+m[2]+' }';
  }).join('\n');
}

// ── Pyodide Python 运行 ─────────────────────────
var _pyodideReady=null; // Promise
window.runPython=function(blockId){
  var block=document.getElementById(blockId);
  if(!block)return;
  var code=block.querySelector('code').textContent;
  var output=block.querySelector('.py-output');
  output.style.display='block';
  output.textContent='⏳ 加载 Python 环境...';

  if(!_pyodideReady){
    _pyodideReady=new Promise(function(resolve){
      var s=document.createElement('script');
      s.src='vendor/pyodide.js';
      s.onload=function(){
        loadPyodide().then(function(py){
          // 重定向 stdout
          py.runPython('import sys, io; sys.stdout=io.StringIO()');
          resolve(py);
        });
      };
      s.onerror=function(){output.textContent='❌ Pyodide 加载失败';_pyodideReady=null};
      document.head.appendChild(s);
    });
  }

  _pyodideReady.then(function(py){
    output.textContent='⏳ 执行中...';
    try{
      py.runPython('sys.stdout=io.StringIO()');
      py.runPython(code);

      output.textContent=stdout||'(无输出)';
    }catch(e){
      output.textContent='❌ '+e.message;
    }
  });
};

function buildMessageNode(message){

  var d=document.createElement('div');
  d.className='m '+role;d.dataset.id=id;d.dataset.role=role;

    var wrap=document.createElement('div');
    wrap.className='avatar-wrap';
    var av=document.createElement('div');
    av.className='avatar';
    var avatarConf=role==='user'?_userAvatar:_aiAvatar;
    if(avatarConf.img){
      av.style.backgroundImage='url('+avatarConf.img+')';
    }else{
      av.textContent=avatarConf.text;
    }
    av.onclick=function(e){e.stopPropagation();showAvatarMenu(d,role,id,av)};
    wrap.appendChild(av);
    d.appendChild(wrap);
  }

  var b=document.createElement('div');b.className='b';
  if(status==='draft'&&!content.trim())
    b.innerHTML='<div class="neko-typing"><span class="paw"></span><span class="paw"></span><span class="paw"></span></div>';
  else if(role==='system')b.textContent=content;
  else{b.innerHTML=renderContent(content,role);postProcessContent(b)}
  // 渲染附件（图片/音频/视频/文件）
  var atts=message.attachments;
  if(atts&&atts.length){
    var ac=document.createElement('div');ac.className='message-attachments';
    for(var j=0;j<atts.length;j++){
      var att=atts[j],el;
      if(att.type&&att.type.indexOf('image/')===0){
        el=document.createElement('img');el.src=att.src;el.alt=att.name||'附件图片';
        el.className='message-attachment-image-thumbnail';
      }else if(att.type&&att.type.indexOf('audio/')===0){
        el=document.createElement('audio');el.src=att.src;el.controls=true;
      }else if(att.type&&att.type.indexOf('video/')===0){
        el=document.createElement('video');el.src=att.src;el.controls=true;el.style.maxWidth='300px';
      }else{
        el=document.createElement('span');el.className='file-attachment-badge';
        el.textContent='\uD83D\uDCC4 '+(att.name||'文件');
      }
      if(el)ac.appendChild(el);
    }
    b.appendChild(ac);
  }
  d.appendChild(b);
  return d;
}

// ── 流式 AST 滑动窗口♡ ──────────────────────────
// 从桌面端 VCPChat 移植的核心优化——猫娘的秘密武器喵！
// 把流式输出分成 Stable（已闭合结构）和 Tail（还在变动的尾部）两层♡
// Stable 区一旦渲染就冻结，只对 Tail 区做 morphdom diff
// 10KB 回复时 morphdom 只需处理最后几百字，而非全文 → CPU 暴降 60%♡
var _streamSegments={}; // msgId → {stableCutoff,stableHtml,lastTailText}

// 在内容容器里创建 Stable/Tail 双层 DOM 结构♡
function ensureStreamingRoots(b){
  var stable=b.querySelector('.vcp-stream-stable-root');
  var tail=b.querySelector('.vcp-stream-tail-root');
  if(!stable||!tail){
    b.innerHTML='';
    stable=document.createElement('div');
    stable.className='vcp-stream-stable-root';
    tail=document.createElement('div');
    tail.className='vcp-stream-tail-root';
    b.appendChild(stable);b.appendChild(tail);
  }
  return {stable:stable,tail:tail};
}

// ── 闭合边界扫描器♡ ─────────────────────────────
// 逐字符扫描已闭合的结构块边界：``` 代码块、工具调用、工具结果、桌面推送
// 遇到未闭合的块就停下——那个位置就是 Stable/Tail 的分界线♡
// 从 startOffset 开始扫描，跳过已确认 stable 的部分，只看新增内容
var _FENCE='```';
var _TOOL_START='<<<[TOOL_REQUEST]>>>';
var _TOOL_END='<<<[END_TOOL_REQUEST]>>>';
var _RESULT_START='[[VCP调用结果信息汇总:';
var _RESULT_END='VCP调用结果结束]]';

function _startsAt(t,i,tok){return t.substr(i,tok.length)===tok}

function _findFenceEnd(t,si){
  var nl=t.indexOf('\n',si);if(nl===-1)return -1;
  var idx=nl+1;
  while(idx<t.length){
    var ci=t.indexOf(_FENCE,idx);if(ci===-1)return -1;
    // 确认 ``` 在行首（允许前导空白）
    var ls=ci===0?0:t.lastIndexOf('\n',ci-1)+1;
    if(t.substring(ls,ci).trim()===''){
      var le=t.indexOf('\n',ci);
      return le===-1?t.length:le+1;
    }
    idx=ci+_FENCE.length;
  }
  return -1;
}

function findExplicitStablePrefix(text,startOffset){
  var i=Math.max(0,startOffset||0),cut=i;
  while(i<text.length){
    // 完整代码块♡ 开头和结尾的 ``` 都找到了才算闭合
    if(_startsAt(text,i,_FENCE)){
      var fe=_findFenceEnd(text,i);
      if(fe===-1)break; // 未闭合→停
      cut=fe;i=fe;continue;
    }
    // 工具调用块
    if(_startsAt(text,i,_TOOL_START)){
      var te=text.indexOf(_TOOL_END,i+_TOOL_START.length);
      if(te===-1)break;
      cut=te+_TOOL_END.length;i=cut;continue;
    }
    // 工具结果块
    if(_startsAt(text,i,_RESULT_START)){
      var re=text.indexOf(_RESULT_END,i+_RESULT_START.length);
      if(re===-1)break;
      cut=re+_RESULT_END.length;i=cut;continue;
    }
    i++;
  }
  return cut;
}

// 流式快速预处理♡ 委托给 _pipeline.streamFast
// 对应桌面端 contentPipeline 的 STREAM_FAST 模式
function streamFastPreprocess(text){
  return _pipeline.streamFast(text);
}

// ── rAF 批处理♡ ─────────────────────────────────
// 流式 delta 更新在 rAF 里合并执行——同帧多个 delta 拼成一次 DOM 操作♡
// 现在配合 Stable/Tail 分层，morphdom 只处理尾部变动区——性能起飞喵！
var _pendingDeltas={};
var _deltaRafScheduled=false;
function scheduleDelta(id,delta){
  if(!_pendingDeltas[id])_pendingDeltas[id]='';
  _pendingDeltas[id]+=delta;
  if(!_deltaRafScheduled){
    _deltaRafScheduled=true;
    requestAnimationFrame(function(){
      _deltaRafScheduled=false;
      var deltas=_pendingDeltas;
      _pendingDeltas={};
      for(var msgId in deltas){
        if(deltas.hasOwnProperty(msgId)){
          vcpChat._appendDelta(msgId,deltas[msgId]);
        }
      }
    });
  }
}

// ── Skill follow-up 合并 ────────────────────────
// 旧版 skill 拦截会为每轮 follow-up 创建独立消息，这里在渲染前合并
function _isSkillFollowUpId(id){
  return /^msg_skill_|^msg_skillexec_|^msg_skillbash_/.test(id);
}
function _mergeSkillFollowUps(msgs){
  if(!msgs||msgs.length<2)return msgs;
  var out=[];
  for(var i=0;i<msgs.length;i++){
    var m=msgs[i],prev=out.length?out[out.length-1]:null;
    if(prev&&prev.role==='assistant'&&m.role==='assistant'&&_isSkillFollowUpId(m.id)){
      prev.content=(prev.content||'')+'\n\n'+(m.content||'');
      // 记录被合并的 ID，addMessage 增量同步时也能识别
      if(!prev._mergedIds)prev._mergedIds=[prev.id];
      prev._mergedIds.push(m.id);
    }else{
      out.push({id:m.id,role:m.role,content:m.content,status:m.status,attachments:m.attachments});
    }
  }
  return out;
}

// ── 公开 API ────────────────────────────────────
// 头像配置 — 可通过 vcpChat.setAvatars() 从 Android 侧设置自定义头像
var _userAvatar={text:'我',img:''};
var _aiAvatar={text:'猫',img:''};

window.vcpChat={
  /** 设置自定义头像。Android 侧调用：vcpChat.setAvatars(userImg, aiImg) */
  setAvatars:function(userImg,aiImg){
    if(userImg)_userAvatar.img=userImg;
    if(aiImg)_aiAvatar.img=aiImg;
    // 更新已有头像
    C.querySelectorAll('.m.user .avatar').forEach(function(a){
      if(userImg)a.style.backgroundImage='url('+userImg+')';
    });
    C.querySelectorAll('.m.assistant .avatar').forEach(function(a){
      if(aiImg)a.style.backgroundImage='url('+aiImg+')';
    });
  },
  addMessage:function(id,role,content,status,attachments){
    if(MM[id]){this.updateMessage(id,content,status);return}
    // Skill follow-up 增量合并：追加到前一个 assistant 气泡
    if(role==='assistant'&&_isSkillFollowUpId(id)){
      var lastEl=C.lastElementChild;
      if(lastEl&&lastEl.dataset.role==='assistant'){
        var b=lastEl.querySelector('.b');
        if(b){
          if(!b._rawContent)b._rawContent=b._lastRenderedContent||'';
          var merged=b._rawContent+'\n\n'+content;
          b._rawContent=merged;
          b.innerHTML=renderContent(merged,role);
          postProcessContent(b);
          MM[id]=lastEl; // 映射到同一个 DOM 节点
          toBottom(status!=='streaming');
          return;
        }
      }
    }
    var d=buildMessageNode({id:id,role:role,content:content,status:status,attachments:attachments});
    C.appendChild(d);MM[id]=d;
    _visObserve(d); // 视界优化器：开始观察这条消息♡
    toBottom(status!=='streaming');
    // 新消息进来时偷偷预加载 anime.js♡ 这样后续动画就不会空转了喵
    ensureAnime(null);
  },
  // ── 流式 AST 滑动窗口渲染♡ ──
  // 从桌面端 VCPChat 移植的核心优化——Stable/Tail 分层 + morphdom♡
  // Stable 区：已闭合的完整结构块（代码块、工具调用等），渲染一次后冻结不再碰
  // Tail 区：正在流式输出的尾部，每帧只对这一小块做 morphdom diff
  // 效果：10KB 回复时 CPU 从 O(全文) 降到 O(tail)，morphdom 只处理几百字♡
  appendStreamDelta:function(id,delta){
    scheduleDelta(id,delta);
  },
  _appendDelta:function(id,delta){
    var d=MM[id];if(!d)return;var b=d.querySelector('.b');if(!b)return;
    d.classList.add('streaming');
    pauseNekoParticles();
    // 累积全文到流式缓冲区♡
    if(!d._streamBuf)d._streamBuf='';
    d._streamBuf+=delta;
    // 初始化 segment state
    if(!_streamSegments[id])_streamSegments[id]={stableCutoff:0,stableHtml:'',lastTailText:''};
    var seg=_streamSegments[id];
    var fullText=d._streamBuf;
    // 创建 Stable/Tail 双层 DOM♡
    var roots=ensureStreamingRoots(b);
    // 扫描闭合边界——找到 Stable/Tail 的分界线
    var nextCut=findExplicitStablePrefix(fullText,seg.stableCutoff);
    // Stable 区前进了♡ 把新确认的部分渲染并冻结
    if(nextCut>seg.stableCutoff){
      var stableText=fullText.slice(0,nextCut);
      var processed=streamFastPreprocess(stableText);
      // 用 marked 做完整 Markdown 渲染（这些内容已经闭合，不会有碎片问题）
      var stHtml=md(processed);
      roots.stable.innerHTML=stHtml;
      seg.stableCutoff=nextCut;
      seg.stableHtml=stHtml;
    }
    // Tail 区：只处理分界线之后的尾部文本♡
    var tailText=fullText.slice(seg.stableCutoff);
    var tailProcessed=streamFastPreprocess(tailText);
    var tailHtml=md(tailProcessed);
    // morphdom 增量 diff Tail 区♡ 只有这一小块在不停变动
    if(typeof morphdom!=='undefined'){
      try{
        morphdom(roots.tail,'<div class="vcp-stream-tail-root">'+tailHtml+'</div>',{
          childrenOnly:true,
          onBeforeElUpdated:function(from,to){
            if(from.isEqualNode(to))return false;
            // 保留流式渐入动画 class
            if(from.classList&&from.classList.contains('vcp-stream-element-fade-in'))
              to.classList.add('vcp-stream-element-fade-in');
            // 保留媒体播放状态
            if((from.tagName==='VIDEO'||from.tagName==='AUDIO')&&!from.paused)return false;
            // 保留已加载图片
            if(from.tagName==='IMG'&&from.complete&&from.naturalWidth>0)return false;
            return true;
          },
          onNodeAdded:function(node){
            // 块级元素渐入动画♡
            if(node.nodeType===1&&/^(P|DIV|UL|OL|LI|PRE|BLOCKQUOTE|H[1-6]|TABLE)$/.test(node.tagName)){
              node.classList.add('vcp-stream-element-fade-in');
              setTimeout(function(){node.classList&&node.classList.remove('vcp-stream-element-fade-in')},800);
            }
            return node;
          }
        });
      }catch(e){
        // 不完整 HTML 导致的 morphdom 异常——流式中预期行为，等下一帧自动恢复♡
        roots.tail.innerHTML=tailHtml;
      }
    }else{
      roots.tail.innerHTML=tailHtml;
    }
    seg.lastTailText=tailText;
    toBottom(false);
  },
  // ── 全量更新（用于 complete / interrupted / error 等非流式状态） ──
  // 流式结束后猫娘会做一次完整的全量渲染♡ 把流式期间追加的碎片全部替换成精美排版
  updateMessage:function(id,content,status){
    // 已合并到父气泡的 skill follow-up 不单独更新
    if(_isSkillFollowUpId(id)&&MM[id]&&MM[id].dataset.id!==id)return;
    this._doUpdateMessage(id,content,status);
  },
  _doUpdateMessage:function(id,content,status){
    var d=MM[id];if(!d)return;var b=d.querySelector('.b');if(!b)return;
    // 清除流式缓冲 + Stable/Tail segment state♡
    d._streamBuf=null;
    delete _streamSegments[id];
    // 清除流式碎片标记
    if(status!=='streaming'&&status!=='draft'){
      d.classList.remove('streaming');resumeNekoParticles();
    }else{
      d.classList.add('streaming');pauseNekoParticles();
    }
    if(status==='draft'&&!content.trim())
      b.innerHTML='<div class="neko-typing"><span class="paw"></span><span class="paw"></span><span class="paw"></span></div>';
    else if(d.dataset.role==='system')b.textContent=content;
    else{
      var newHtml=renderContent(content,d.dataset.role);
      b.innerHTML=newHtml;
      b._lastRenderedContent=content;
      if(status!=='streaming'&&status!=='draft'){
        postProcessContent(b);
        // "继续生成"功能已移至 AI 头像点击菜单喵
      }
    }
    throttleScroll();
  },
  removeMessage:function(id){
    var d=MM[id];if(!d)return;
    // 已合并到父气泡的 skill follow-up：只清映射，不删 DOM
    if(_isSkillFollowUpId(id)&&d.dataset.id!==id){delete MM[id];return}
    if(_visObserver)_visObserver.unobserve(d);
    d.remove();delete MM[id];delete _streamSegments[id];
  },
  // 原地替换消息（附件更新时使用，保持位置不变）
  replaceMessage:function(id,role,content,status,attachments){
    var old=MM[id];
    if(!old){this.addMessage(id,role,content,status,attachments);return}
    var d=buildMessageNode({id:id,role:role,content:content,status:status,attachments:attachments});
    old.parentNode.replaceChild(d,old);MM[id]=d;
  },
  clearChat:function(){C.innerHTML='';MM={};_streamSegments={};},
  loadHistory:function(json){
    var msgs=_mergeSkillFollowUps(JSON.parse(json)),frag=document.createDocumentFragment();
    for(var i=0;i<msgs.length;i++){
      var m=msgs[i],d=buildMessageNode(m);
      frag.appendChild(d);MM[m.id]=d;
    }
    C.appendChild(frag);
    // 批量观察所有历史消息♡ appendChild 后元素才在 DOM 中
    for(var mid in MM){if(MM.hasOwnProperty(mid))_visObserve(MM[mid])}
    autoScroll=true;C.scrollTop=C.scrollHeight;
  },
  scrollToBottom:function(){autoScroll=true;toBottom(true)},
  setTheme:function(dark){document.documentElement.style.colorScheme=dark?'dark':'light'}
};

// ── iframe postMessage 桥接 ─────────────
// iframe 内的 input() 通过 postMessage 发到父页面，父页面转发给 AI
window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='vcp-input'&&typeof e.data.text==='string'){
    window.input(e.data.text);
  }
});
// 注入 iframe 的桥接脚本：提供 window.input() 函数
var _iframeBridgeScript='<script>window.input=function(t){parent.postMessage({type:"vcp-input",text:String(t)},"*")};<\/script>';

// ── AI 按钮交互（window.input 函数）─────────────
// AI 生成的 HTML 里的 <button> 可以调用 input('消息') 来发送消息
// 对应 VCPChat 桌面端的 contentProcessor.js processInteractiveButtons
window.input=function(text){
  if(!text)return;
  var msg='[[点击按钮:'+text+']]';
  if(window.VcpChatBridge&&window.VcpChatBridge.onAction){
    window.VcpChatBridge.onAction('send',msg);
  }
};

// 自动给 AI 生成的按钮绑定点击事件（跳过交互式 HTML 内容里的按钮）
function processButtons(container){
  var btns=container.querySelectorAll('button:not([data-vcp-processed])');
  btns.forEach(function(btn){
    // 跳过交互式 HTML / iframe 预览 / html-render 里有 onclick 的按钮
    if(btn.closest('.html-render[data-full-html]')||btn.closest('.html-preview-bar'))return;
    if(btn.closest('.html-render')&&btn.hasAttribute('onclick'))return;
    btn.setAttribute('data-vcp-processed','1');
    btn.style.cursor='pointer';
    btn.addEventListener('click',function(e){
      e.preventDefault();e.stopPropagation();
      // 优先 data-send 属性，其次按钮自身的纯文本内容（去掉多余空白）
      var sendText=(btn.getAttribute('data-send')||btn.textContent||'').replace(/\s+/g,' ').trim();
      // 防止发送过长内容（如 HTML 残留）
      if(sendText.length>500)sendText=sendText.substring(0,500);
      if(!sendText)return;
      // 发送
      window.input(sendText);
      // 禁用按钮
      btn.disabled=true;btn.style.opacity='0.5';
      btn.textContent='✓ '+btn.textContent;
    });
  });
}

// 后处理：扫描 DOM 中的完整 HTML 文档并添加预览按钮
function processHtmlPreviews(container){
  // 扫描所有可能包含完整 HTML 文档的元素：
  // <code>、<pre>、以及 monospace 字体的 <div>（AI 经常用 inline style 输出代码）
  var candidates=container.querySelectorAll('code:not([data-hp]),pre:not([data-hp])');
  candidates.forEach(function(el){checkAndWrapPreview(el)});

  // 扫描 html-render 容器（包括完整 HTML 文档和 monospace 代码展示）
  var renders=container.querySelectorAll('.html-render:not([data-hp])');
  renders.forEach(function(el){
    el.setAttribute('data-hp','1');
    // 完整 HTML 文档 / 交互式片段：用 iframe 隔离运行（脚本不能在主页面执行，会污染聊天 DOM）
    if(el.getAttribute('data-full-html')==='1'){
      var raw=el.innerHTML;
      // 尝试修复被后端吃掉的 onclick 属性
      raw=raw.replace(/<button([^>]*?)\s+(\w+)',\s*(-?\d+)\)">/gi,function(_,attrs,move,dir){
        return '<button'+attrs+' onclick="rotate(\''+move+'\', '+dir+')">';
      });
      var id='hp_'+Date.now()+'_'+Math.random().toString(36).substr(2,4);
      var preview=document.createElement('div');
      preview.className='html-preview'+(PERF_FLAGS.autoRunFullHtml?' active':'');
      preview.id=id;
      preview.dataset.src=raw;
      preview.dataset.complete='1';
      var bar=document.createElement('div');
      bar.className='html-preview-bar';
      bar.innerHTML='<span>交互式 HTML</span><button onclick="toggleHtmlPreview(\''+id+'\')">'+(PERF_FLAGS.autoRunFullHtml?'🔙 关闭预览':'▶️ 运行')+'</button>';
      var placeholder=document.createElement('div');
      placeholder.className='html-preview-placeholder';
      placeholder.textContent='已禁用自动运行，点击“运行”再加载预览。';
      var iframe=document.createElement('iframe');
      iframe.sandbox='allow-scripts';
      iframe.style.display=PERF_FLAGS.autoRunFullHtml?'block':'none';
      if(PERF_FLAGS.autoRunFullHtml){
        iframe.srcdoc=_iframeBridgeScript+raw;
        iframe.onload=function(){
          try{
            var h=iframe.contentDocument.documentElement.scrollHeight;
            iframe.style.height=Math.max(h,200)+'px';
          }catch(e){iframe.style.height='400px'}
        };
      }
      el.parentNode.insertBefore(preview,el);
      preview.appendChild(bar);
      preview.appendChild(placeholder);
      preview.appendChild(iframe);
      el.remove();
      return;
    }
    // 其他情况：检测 textContent 里的 HTML（被转义展示的代码）
    var text=el.textContent||'';
    if(!/<!DOCTYPE\s+html|<html[\s>]/i.test(text))return;
    if(text.length<100)return;
    wrapAsPreview(el,text);
  });
}

function checkAndWrapPreview(el){
  el.setAttribute('data-hp','1');
  var text=el.textContent||'';
  if(!/<!DOCTYPE\s+html|<html[\s>]/i.test(text))return;
  if(text.length<100)return;
  var wrapper=el.closest('.code-block')||el.closest('pre')||el;
  if(wrapper.querySelector('.html-preview-bar'))return;
  wrapAsPreview(wrapper,text);
}

function wrapAsPreview(wrapper,htmlSource){
  var id='hp_'+Date.now()+'_'+Math.random().toString(36).substr(2,4);
  var preview=document.createElement('div');
  preview.className='html-preview';
  preview.id=id;
  // 检测 HTML 完整性
  var isComplete=/<\/html\s*>/i.test(htmlSource);
  preview.dataset.src=htmlSource;
  preview.dataset.complete=isComplete?'1':'0';
  var bar=document.createElement('div');
  bar.className='html-preview-bar';
  var label=isComplete?'HTML 文档':'HTML 文档 <span style="color:var(--orange);font-size:11px">（不完整）</span>';
  bar.innerHTML='<span>'+label+'</span><button onclick="toggleHtmlPreview(\''+id+'\')">'+(isComplete?'▶️ 运行':'⚠️ 尝试运行')+'</button>';
  var iframe=document.createElement('iframe');
  iframe.sandbox='allow-scripts';
  iframe.style.display='none';
  wrapper.parentNode.insertBefore(preview,wrapper);
  preview.appendChild(bar);
  preview.appendChild(wrapper);
  preview.appendChild(iframe);
}

// ── 图片查看器：捏合缩放 + 拖拽平移喵♡ ──────────
var _imgZoom={scale:1,x:0,y:0};
var _pinch={active:false,startDist:0,startScale:1};
var _drag={active:false,startX:0,startY:0,lastX:0,lastY:0};

function pinchDist(t1,t2){
  var dx=t1.clientX-t2.clientX,dy=t1.clientY-t2.clientY;
  return Math.sqrt(dx*dx+dy*dy);
}
function applyImgTransform(){
  viewerImg.style.transform='translate('+_imgZoom.x+'px,'+_imgZoom.y+'px) scale('+_imgZoom.scale+')';
}

viewerImg.addEventListener('touchstart',function(e){
  if(e.touches.length===2){
    e.preventDefault();
    _pinch.active=true;
    _pinch.startDist=pinchDist(e.touches[0],e.touches[1]);
    _pinch.startScale=_imgZoom.scale;
    viewerImg.style.transition='none';
  }else if(e.touches.length===1&&_imgZoom.scale>1){
    _drag.active=true;
    _drag.startX=e.touches[0].clientX-_imgZoom.x;
    _drag.startY=e.touches[0].clientY-_imgZoom.y;
    viewerImg.style.transition='none';
  }
},{passive:false});

viewerImg.addEventListener('touchmove',function(e){
  if(_pinch.active&&e.touches.length===2){
    e.preventDefault();
    var dist=pinchDist(e.touches[0],e.touches[1]);
    var newScale=_pinch.startScale*(dist/_pinch.startDist);
    _imgZoom.scale=Math.max(0.5,Math.min(5,newScale));
    applyImgTransform();
  }else if(_drag.active&&e.touches.length===1){
    e.preventDefault();
    _imgZoom.x=e.touches[0].clientX-_drag.startX;
    _imgZoom.y=e.touches[0].clientY-_drag.startY;
    applyImgTransform();
  }
},{passive:false});

viewerImg.addEventListener('touchend',function(e){
  if(e.touches.length<2)_pinch.active=false;
  if(e.touches.length===0){
    _drag.active=false;
    viewerImg.style.transition='transform 0.2s ease-out';
    // 缩小到 1 以下时弹回
    if(_imgZoom.scale<1){
      _imgZoom={scale:1,x:0,y:0};
      applyImgTransform();
    }
    // 缩放为 1 时重置位移
    if(Math.abs(_imgZoom.scale-1)<0.05){
      _imgZoom={scale:1,x:0,y:0};
      applyImgTransform();
    }
  }
});

// 双击缩放切换（1x ↔ 2.5x）
var _lastTap=0;
viewerImg.addEventListener('touchend',function(e){
  if(e.touches.length>0)return;
  var now=Date.now();
  if(now-_lastTap<300){
    viewerImg.style.transition='transform 0.3s cubic-bezier(0.34,1.56,0.64,1)';
    if(_imgZoom.scale>1.2){
      _imgZoom={scale:1,x:0,y:0};
    }else{
      _imgZoom.scale=2.5;
    }
    applyImgTransform();
    _lastTap=0;
  }else{
    _lastTap=now;
  }
});

// ── Base64 UTF-8 解码（atob 只支持 Latin1，这里处理中文等多字节字符）
window.b64d=function(b64){
  try{
    var bin=atob(b64);
    var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }catch(e){return atob(b64)}
};

// 估算 token 数（中文约 1.5 token/字，英文约 0.75 token/word）
function estimateTokens(text){
  if(!text)return 0;
  var cjk=(text.match(/[\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7af]/g)||[]).length;
  var rest=text.replace(/[\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7af]/g,' ');
  var words=rest.trim().split(/\s+/).filter(function(w){return w.length>0}).length;
  return Math.round(cjk*1.5+words*0.75);
}

var MOOD_HAPPY=/[哈嘻😄😊🎉✅👍开心高兴好的没问题当然可以完成成功太棒喵~♪♡❤️💕😺🐱]/;
var MOOD_THINK=/[思考让我想想嗯\.\.\.分析考虑可能也许大概或许🤔💭推测假设]/;
var MOOD_SAD=/[抱歉对不起失败错误无法不能问题出错❌😥😢⚠️遗憾不好意思]/;
// 害羞/撒娇关键词 — 涩涩的猫娘反应喵

function detectMood(text){
  if(!text)return'happy';
  var t=text.substring(0,300);
  if(MOOD_SHY.test(t))return'shy';
  if(MOOD_SAD.test(t))return'sad';
