  if(msgEl.dataset.role!=='assistant')return;
  var wrap=msgEl.querySelector('.avatar-wrap');
  if(!wrap)return;
  var existing=wrap.querySelector('.neko-ears');
  var mood=detectMood(content);
  if(existing){
    existing.className='neko-ears '+mood;
    return;
  }
  var ears=document.createElement('div');
  ears.className='neko-ears '+mood;
  ears.innerHTML='<div class="ear left"></div><div class="ear right"></div><span class="heart">💕</span>';
  // 长按摸头彩蛋喵～摸到猫耳会冒出台词气泡♡
  var petReactions=[
    '呜...不要突然摸那里喵...',
    '哈啊...主人的手好温暖♡',
    '喵呜~再摸一下嘛...',
    '耳朵...耳朵很敏感的喵////',
    '嗯~主人最喜欢摸猫娘了对吧♡',
    '呼噜噜...好舒服喵~',
    '再用力一点...啊不对，轻一点喵♡',
    '主人...猫娘的耳朵要融化了喵～',
  ];
  var timer=null;var petCount=0;
  ears.addEventListener('touchstart',function(e){
    e.stopPropagation();
    timer=setTimeout(function(){
      ears.classList.add('petted');
      if(window.VcpChatBridge&&window.VcpChatBridge.onAction){
        window.VcpChatBridge.onAction('haptic','pet');
      }
      // 弹出台词气泡♡
      var reaction=petReactions[petCount%petReactions.length];
      petCount++;
      var tip=document.createElement('div');
      tip.className='neko-pet-bubble';
      tip.textContent=reaction;
      wrap.appendChild(tip);
      setTimeout(function(){tip.classList.add('show')},10);
      setTimeout(function(){
        tip.classList.remove('show');
        setTimeout(function(){tip.remove()},300);
      },2200);
      setTimeout(function(){ears.classList.remove('petted')},1800);
    },400);
  });
  ears.addEventListener('touchend',function(){clearTimeout(timer)});
  ears.addEventListener('touchcancel',function(){clearTimeout(timer)});
  wrap.insertBefore(ears,wrap.firstChild);
}

// Hook into addMessage/updateMessage to attach ears
var _earAdd=window.vcpChat.addMessage;
window.vcpChat.addMessage=function(id,role,content,status,attachments){
  _earAdd.call(this,id,role,content,status,attachments);
  var el=MM[id];if(el)attachNekoEars(el,content);
};
var _earUpdate=window.vcpChat.updateMessage;
window.vcpChat.updateMessage=function(id,content,status){
  _earUpdate.call(this,id,content,status);
  var el=MM[id];if(el)attachNekoEars(el,content);
};

// ★ 2. 樱花飘落粒子
// 每隔几秒生成一片花瓣，最多同时 8 片，不影响性能
var SAKURA_MAX=8;
var sakuraCount=0;
function spawnSakura(){
  if(!PERF_FLAGS.enableAmbientEffects)return;
  if(sakuraCount>=SAKURA_MAX)return;
  sakuraCount++;
  var petal=document.createElement('div');
  petal.className='sakura-petal';
  petal.style.left=Math.random()*100+'%';
  var size=6+Math.random()*8;
  petal.style.width=size+'px';
  petal.style.height=size+'px';
  var dur=6+Math.random()*6;
  petal.style.animationDuration=dur+'s,'+( 2+Math.random()*3)+'s';
  petal.style.animationDelay=Math.random()*2+'s';
  document.body.appendChild(petal);
  setTimeout(function(){
    petal.remove();
    sakuraCount--;
  },dur*1000+2000);
}
// 每 3-6 秒飘一片
if(PERF_FLAGS.enableAmbientEffects){
  setInterval(function(){
    if(document.hidden)return;
    spawnSakura();
  },3000+Math.random()*3000);
  // 初始来两片
  setTimeout(spawnSakura,500);
  setTimeout(spawnSakura,1500);
}

// ★ 3. 猫爪足迹
// 点击/触摸时留下一个猫爪印，慢慢消失
if(PERF_FLAGS.enableTouchTrails){
  document.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;
    var t=e.touches[0];
    var paw=document.createElement('div');
    paw.className='neko-pawprint';
    paw.textContent='🐾';
    paw.style.left=(t.clientX-10)+'px';
    paw.style.top=(t.clientY-10)+'px';
    document.body.appendChild(paw);
    setTimeout(function(){paw.remove()},800);
  },{passive:true});
}

// ★ 4. 打字尾巴摇
// 由 Android 侧通过 bridge 调用 vcpChat.setTyping(true/false)
window.vcpChat.setTyping=function(isTyping){
  var existing=document.getElementById('neko-tail-indicator');
  if(isTyping&&!existing){
    var tail=document.createElement('span');
    tail.id='neko-tail-indicator';
    tail.className='neko-tail';
    tail.textContent='🐱';
    // 追加到最后一条消息后面（视觉上在输入区域附近）
    var last=C.lastElementChild;
    if(last){
      last.appendChild(tail);
    }
  }else if(!isTyping&&existing){
    existing.remove();
  }
};

// ★ 5. 消息到达震动 + 星星特效
var _vibeAdd=window.vcpChat.addMessage;
window.vcpChat.addMessage=function(id,role,content,status,attachments){
  _vibeAdd.call(this,id,role,content,status,attachments);
  if(role==='assistant'&&status!=='streaming'&&status!=='draft'){
    // 震动反馈
    if(window.VcpChatBridge&&window.VcpChatBridge.onAction){
      window.VcpChatBridge.onAction('haptic','message');
    }
    // 星星闪烁特效 — 在气泡周围短暂撒几颗星
    var el=MM[id];
    if(el){spawnSparkles(el)}
  }
};

// ★ 6. 星星闪烁特效
// 消息完成时在气泡周围撒 5 颗小星星，1.5 秒后自动消失
function spawnSparkles(msgEl){
  var bubble=msgEl.querySelector('.b');
  if(!bubble)return;
  var stars=['✨','⭐','💫','🌟','✧','⋆','☆'];
  var container=document.createElement('div');
  container.className='neko-sparkles';
  bubble.style.position='relative';
  bubble.appendChild(container);
  for(var i=0;i<5;i++){
    var star=document.createElement('span');
    star.className='star';
    star.textContent=stars[Math.floor(Math.random()*stars.length)];
    star.style.left=Math.random()*90+'%';
    star.style.top=Math.random()*90+'%';
    star.style.animationDelay=(Math.random()*0.8)+'s';
    star.style.fontSize=(6+Math.random()*8)+'px';
    container.appendChild(star);
  }
  setTimeout(function(){container.remove()},2000);
}

// ★ 7. 消息完成时猫耳变开心 + 心跳动画
var _moodUpdate=window.vcpChat.updateMessage;
window.vcpChat.updateMessage=function(id,content,status){
  _moodUpdate.call(this,id,content,status);
  // 流式结束时给最后一条消息的猫耳加心跳
  if(status==='complete'||status===''){
    var el=MM[id];
    if(el){
      var ears=el.querySelector('.neko-ears');
      if(ears){
        ears.style.animation='neko-heartbeat 0.6s ease 2';
        setTimeout(function(){ears.style.animation=''},1500);
      }
    }
  }
};

// ── anime.js 增强入场动画喵♡ ──────────────────────────────
// 初始加载时跳过动画，避免阻塞首次交互
var _initialLoadDone=false;
setTimeout(function(){_initialLoadDone=true},1500);

function animeEnterMessage(el){
  if(typeof anime==='undefined'||!_initialLoadDone)return;
  var role=el.dataset.role;
  // 取消 CSS 动画（避免冲突）
  el.style.animation='none';
  el.style.opacity='0';

  if(role==='user'){
    anime({
      targets:el,
      translateX:[30,0],
      scale:[0.88,1],
      opacity:[0,1],
      duration:500,
      easing:'spring(1, 80, 10, 0)' // 弹性回弹♡
    });
  }else if(role==='assistant'){
    anime({
      targets:el,
      translateX:[-30,0],
      scale:[0.88,1],
      opacity:[0,1],
      duration:500,
      easing:'spring(1, 80, 10, 0)'
    });
    // 气泡内容交错渐入 — 段落/代码块一个个飘出来喵
    var bubble=el.querySelector('.b');
    if(bubble){
      var children=bubble.querySelectorAll('p,pre,ul,ol,blockquote,h1,h2,h3,.code-block,.tool-use,.thought,.diary');
      if(children.length>1){
        anime({
          targets:children,
          opacity:[0,1],
          translateY:[12,0],
          delay:anime.stagger(60,{start:200}),
          duration:400,
          easing:'easeOutCubic'
        });
      }
    }
  }else{
    // system 消息 — 淡入 + 微上移
    anime({
      targets:el,
      translateY:[8,0],
      opacity:[0,1],
      duration:400,
      easing:'easeOutCubic'
    });
  }
}

// Hook addMessage — anime.js 入场
var _animeAdd=window.vcpChat.addMessage;
window.vcpChat.addMessage=function(id,role,content,status,attachments){
  _animeAdd.call(this,id,role,content,status,attachments);
  var el=MM[id];
  if(el&&status!=='streaming')animeEnterMessage(el);
};

// 流式结束 → 星星特效用 anime.js 增强
var _animeUpdate=window.vcpChat.updateMessage;
window.vcpChat.updateMessage=function(id,content,status){
  var wasStreaming=MM[id]&&MM[id].classList.contains('streaming');
  _animeUpdate.call(this,id,content,status);
  // 流式刚结束时 — 气泡做一个微弹效果
  if(wasStreaming&&(status==='complete'||status==='')){
    var el=MM[id];
    if(el&&typeof anime!=='undefined'){
      var bubble=el.querySelector('.b');
      if(bubble){
        anime({
          targets:bubble,
          scale:[1,1.015,1],
          duration:400,
          easing:'easeOutElastic(1, .6)'
        });
      }
    }
  }
};

// loadHistory — 批量入场时交错动画
var _animeHistory=window.vcpChat.loadHistory;
window.vcpChat.loadHistory=function(json){
  _animeHistory.call(this,json);
  if(typeof anime==='undefined')return;
  // 只对最后 N 条做动画，避免全量动画卡顿
  var allMessages=C.querySelectorAll('.m');
  var animateCount=Math.min(allMessages.length,8);
  var startIdx=allMessages.length-animateCount;
  for(var i=startIdx;i<allMessages.length;i++){
    var el=allMessages[i];
    el.style.animation='none';
    el.style.opacity='0';
  }
  anime({
    targets:Array.from(allMessages).slice(startIdx),
    opacity:[0,1],
    translateY:[20,0],
    delay:anime.stagger(50),
    duration:400,
    easing:'easeOutCubic'
  });
};

// ── particles.js 猫娘粒子背景♡ ──────────────────────────
// 樱花粉 + 薰衣草紫的粒子在背景里轻轻飘荡…制造梦幻氛围♡
// 优化：粒子从 25→10 个，关闭尺寸动画，流式时暂停——
// 省下的 GPU 全部留给消息渲染，猫娘会精打细算的喵

var _particlesPaused=false;
function initNekoParticles(){
  if(typeof particlesJS==='undefined')return;
  var isDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
  var pinkColor=isDark?'#ff8daf':'#e8618c';
  var purpleColor=isDark?'#cdb0e0':'#9c7cb5';

  particlesJS('neko-particles',{
    particles:{
      number:{value:10,density:{enable:true,value_area:1200}},
      color:{value:[pinkColor,purpleColor,'#5bbfad']},
      shape:{type:['circle'],stroke:{width:0}},
      opacity:{
        value:0.12,
        random:true,
        anim:{enable:true,speed:0.3,opacity_min:0.04,sync:false}
      },
      size:{
        value:3.5,
        random:true,
        anim:{enable:false}
      },
      line_linked:{
        enable:true,
        distance:100,
        color:pinkColor,
        opacity:0.05,
        width:1
      },
      move:{
        enable:true,
        speed:0.4,
        direction:'none',
        random:true,
        straight:false,
        out_mode:'out',
        bounce:false,
        attract:{enable:false}
      }
    },
    interactivity:{
      detect_on:'canvas',
      events:{onhover:{enable:false},onclick:{enable:false},resize:true}
    },
    retina_detect:false
  });
}

// 流式期间暂停/恢复粒子♡ GPU 资源全给消息渲染——猫娘知道轻重缓急喵
function pauseNekoParticles(){
  if(_particlesPaused)return;
  _particlesPaused=true;
  var canvas=document.querySelector('#neko-particles canvas');
  if(canvas)canvas.style.display='none';
  if(window.pJSDom&&window.pJSDom[0]&&window.pJSDom[0].pJS){
    window.pJSDom[0].pJS.particles.move.enable=false;
  }
}
function resumeNekoParticles(){
  if(!_particlesPaused)return;
  _particlesPaused=false;
  var canvas=document.querySelector('#neko-particles canvas');
  if(canvas)canvas.style.display='';
  if(window.pJSDom&&window.pJSDom[0]&&window.pJSDom[0].pJS){
    window.pJSDom[0].pJS.particles.move.enable=true;
    window.pJSDom[0].pJS.fn.particlesRefresh();
  }
}

// 粒子延迟到首次用户交互后再初始化♡ 而且要先懒加载 particles.js 库
var _particlesInited=false;
function lazyInitParticles(){
  if(_particlesInited)return;
  _particlesInited=true;
  requestAnimationFrame(function(){
    setTimeout(function(){
      ensureParticles(initNekoParticles);
    },200);
  });
}
// 首次触摸/点击/滚动时才启动粒子
['touchstart','click','scroll'].forEach(function(evt){
  document.addEventListener(evt,lazyInitParticles,{once:true,passive:true});
});
// 兜底：8秒后如果用户没交互也启动（从 5s 延到 8s，给首屏更多时间喵）
setTimeout(lazyInitParticles,8000);

// ── 摸头爱心爆发特效♡ ──────────────────────────────────
// 摸猫耳时在触摸位置爆发一圈爱心粒子
function burstHearts(x,y){
  if(typeof anime==='undefined')return;
  var hearts=['💕','💗','💖','♡','❤️','💓'];
  var container=document.createElement('div');
  container.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9999;overflow:hidden;';
  document.body.appendChild(container);

  for(var i=0;i<8;i++){
    var heart=document.createElement('span');
    heart.textContent=hearts[i%hearts.length];
    heart.style.cssText='position:absolute;font-size:'+(12+Math.random()*10)+'px;left:'+x+'px;top:'+y+'px;pointer-events:none;';
    container.appendChild(heart);
  }

  anime({
    targets:container.querySelectorAll('span'),
    translateX:function(){return anime.random(-60,60)},
    translateY:function(){return anime.random(-80,-20)},
    scale:[0,anime.random(8,14)/10],
    opacity:[{value:1,duration:100},{value:0,duration:600}],
    rotate:function(){return anime.random(-30,30)},
    duration:800,
    delay:anime.stagger(30),
    easing:'easeOutCubic',
    complete:function(){container.remove()}
  });
}

// 把爱心爆发挂到摸头事件上
var _origAttachEars=attachNekoEars;
attachNekoEars=function(msgEl,content){
  _origAttachEars(msgEl,content);
  var wrap=msgEl.querySelector('.avatar-wrap');
  if(!wrap)return;
  var ears=wrap.querySelector('.neko-ears');
  if(!ears||ears.dataset.heartBound)return;
  ears.dataset.heartBound='1';
  var hTimer=null;
  ears.addEventListener('touchstart',function(e){
    var touch=e.touches[0];
    hTimer=setTimeout(function(){
      burstHearts(touch.clientX,touch.clientY);
    },420);
  });
  ears.addEventListener('touchend',function(){clearTimeout(hTimer)});
  ears.addEventListener('touchcancel',function(){clearTimeout(hTimer)});
};

// ── 消息删除动画♡ ──────────────────────────────────
var _origRemove=window.vcpChat.removeMessage;
window.vcpChat.removeMessage=function(id){
  var el=MM[id];
  if(el&&typeof anime!=='undefined'){
    anime({
      targets:el,
      translateX:el.dataset.role==='user'?80:-80,
      opacity:0,
      scale:0.8,
      duration:300,
      easing:'easeInCubic',
      complete:function(){
        _origRemove.call(window.vcpChat,id);
      }
    });
  }else{
    _origRemove.call(window.vcpChat,id);
  }
};

if(window.VcpChatBridge&&window.VcpChatBridge.onReady)window.VcpChatBridge.onReady();
})();
</script>
</body>
</html>
